<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Prevents page zooming and mobile viewport clipping -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>All Candidate Pictures - Gallery</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --accent-gold: #D4AF37;
            --accent-gold-dark: #AA7C11;
            --text-color: #FFFFFF;
            --border-color: #333333;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: var(--bg-color);
            color: var(--text-color);
            width: 100%;
            min-height: 100vh;
            touch-action: manipulation;
            overflow-x: hidden;
        }

        body { 
            padding: 16px; 
            max-width: 600px; 
            margin: 0 auto; 
        }
        
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-bottom: 16px; 
            border-bottom: 1.5px solid var(--accent-gold); 
            margin-bottom: 20px; 
        }

        h1 { 
            font-size: 18px; 
            color: var(--accent-gold); 
            font-weight: 800;
            text-transform: uppercase;
        }

        .nav-link { 
            color: var(--accent-gold); 
            text-decoration: none; 
            font-size: 15px; 
            font-weight: 700;
        }

        /* 2-Column Responsive Mobile Grid */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 14px; 
        }

        .profile-card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1.5px solid var(--accent-gold);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15); 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }

        .card-label {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #FFFFFF;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            z-index: 2;
        }

        /* Displays entire photo fully without cropping */
        .profile-card img { 
            width: 100%; 
            height: 220px; 
            object-fit: contain; 
            background: #000000;
            display: block;
        }

        /* Loading Spinner */
        .spinner { 
            border: 4px solid rgba(255,255,255,0.1); 
            width: 48px; 
            height: 48px; 
            border-radius: 50%; 
            border-left-color: var(--accent-gold); 
            animation: spin 1s linear infinite; 
            margin: 40px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="nav-link">&larr; Back to Selection</a>
    <h1>Available Candidates</h1>
</header>

<div class="grid-container" id="galleryGrid">
    <div style="grid-column: 1/-1; text-align: center;">
        <div class="spinner"></div>
        <p style="color:#FFFFFF; font-weight:700;">Loading all pictures...</p>
    </div>
</div>

<script>
    const GITHUB_USERNAME = "gempluto";
    const REPO_NAME = "my-project";

    // All possible folders where candidate pictures are stored
    const foldersToScan = [
        '', // Root images folder
        'sugar_mommy',
        'vip_social',
        'private_video',
        'casual_friendship',
        'media_exchange',
        'serious_ng',
        'serious_int',
        'paid_chat'
    ];

    window.addEventListener('DOMContentLoaded', () => {
        loadAllPhotosImmediately();
    });

    async function loadAllPhotosImmediately() {
        const grid = document.getElementById('galleryGrid');
        let allImageFiles = [];

        try {
            // Fetch images across ALL folders simultaneously
            const fetchPromises = foldersToScan.map(folder => {
                const path = folder ? `images/${folder}` : `images`;
                return fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${path}`)
                    .then(res => res.ok ? res.json() : [])
                    .catch(() => []);
            });

            const results = await Promise.all(fetchPromises);

            results.forEach((files, index) => {
                if (Array.isArray(files)) {
                    const folder = foldersToScan[index];
                    files.forEach(file => {
                        // Keep only valid image files
                        if (file.type === 'file' && file.name.match(/\.(jpg|jpeg|png|webp)$/i)) {
                            const rawUrl = folder 
                                ? `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/images/${folder}/${file.name}`
                                : `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/images/${file.name}`;

                            allImageFiles.push({
                                url: file.download_url || rawUrl,
                                fallback: rawUrl
                            });
                        }
                    });
                }
            });

            if (allImageFiles.length === 0) {
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#FFFFFF; font-weight:700; margin-top:20px;'>No candidate pictures uploaded yet.</p>";
                return;
            }

            // Render all collected pictures immediately
            grid.innerHTML = '';
            allImageFiles.forEach((imgObj) => {
                grid.innerHTML += `
                    <div class="profile-card">
                        <span class="card-label">Candidate</span>
                        <img 
                            src="${imgObj.url}" 
                            alt="Candidate" 
                            onerror="this.onerror=null; this.src='${imgObj.fallback}';"
                        >
                    </div>
                `;
            });

        } catch (err) {
            grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#FFFFFF; font-weight:700; margin-top:20px;'>Error loading pictures. Please refresh the page.</p>";
        }
    }
</script>
</body>
</html>
