<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chats - Connection Platform</title>
    <style>
        :root {
            --bg-app: #111b21;
            --bg-sidebar: #111b21;
            --bg-header: #202c33;
            --bg-search: #202c33;
            --bg-chat-pane: #0b141a;
            --bg-hover: #202c33;
            --bg-active: #2a3942;
            --border-color: #222d34;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --accent-green: #00a884;
            --bubble-ai: #005c4b;
            --bubble-visitor: #202c33;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg-app);
            color: var(--text-primary);
            overflow: hidden;
        }

        .wa-layout {
            display: flex;
            width: 100%;
            height: 100vh;
            height: 100dvh;
        }

        .sidebar {
            width: 390px;
            max-width: 100%;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            height: 60px;
            background: var(--bg-header);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            gap: 8px;
        }

        .sidebar-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .sidebar-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .new-count-pill {
            background: var(--accent-green);
            color: #111b21;
            font-size: 11.5px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 12px;
            white-space: nowrap;
        }

        .header-tools {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .tool-btn {
            background: #2a3942;
            border: none;
            color: var(--text-primary);
            font-size: 12px;
            padding: 6px 9px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .tool-btn.muted {
            color: #f87171;
        }

        .search-bar-wrap {
            padding: 8px 12px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
        }

        .search-input {
            width: 100%;
            background: var(--bg-search);
            border: none;
            outline: none;
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .contact-list {
            flex: 1;
            overflow-y: auto;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid rgba(34, 45, 52, 0.6);
            transition: background 0.15s;
        }

        .contact-item:hover {
            background: var(--bg-hover);
        }

        .contact-item.active {
            background: var(--bg-active);
        }

        .contact-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2a3942;
            color: var(--accent-green);
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .contact-name {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-time {
            font-size: 12px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .contact-item.unread .contact-time {
            color: var(--accent-green);
            font-weight: 600;
        }

        .contact-bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .contact-preview {
            font-size: 13.5px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: var(--accent-green);
            color: #111b21;
            font-size: 11px;
            font-weight: 800;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .empty-sidebar {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
        }

        .chat-pane {
            flex: 1;
            background: var(--bg-chat-pane);
            display: flex;
            flex-direction: column;
            min-width: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .chat-pane-header {
            height: 60px;
            background: var(--bg-header);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            padding-right: 4px;
        }

        .pane-user-meta {
            flex: 1;
            min-width: 0;
        }

        .pane-user-name {
            font-size: 16px;
            font-weight: 600;
        }

        .pane-user-sub {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .messages-feed {
            flex: 1;
            overflow-y: auto;
            padding: 18px 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg-bubble {
            max-width: 72%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            line-height: 1.42;
            word-break: break-word;
            position: relative;
        }

        /* Visitor message on the LEFT */
        .msg-bubble.visitor {
            align-self: flex-start;
            background: var(--bubble-visitor);
            color: var(--text-primary);
            border-top-left-radius: 0;
        }

        /* AI (Mercy) reply on the RIGHT */
        .msg-bubble.ai {
            align-self: flex-end;
            background: var(--bubble-ai);
            color: var(--text-primary);
            border-top-right-radius: 0;
        }

        .msg-sender-tag {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 3px;
            color: var(--accent-green);
        }

        .msg-bubble.ai .msg-sender-tag {
            color: #7ee2c8;
        }

        .msg-time {
            font-size: 11px;
            color: rgba(233, 237, 239, 0.65);
            text-align: right;
            margin-top: 4px;
        }

        .empty-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            color: var(--text-secondary);
        }

        .empty-pane h2 {
            color: var(--text-primary);
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .empty-pane p {
            max-width: 380px;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
            }
            .chat-pane {
                display: none;
                width: 100%;
            }
            .wa-layout.mobile-chat-open .sidebar {
                display: none;
            }
            .wa-layout.mobile-chat-open .chat-pane {
                display: flex;
            }
            .back-btn {
                display: inline-block;
            }
            .msg-bubble {
                max-width: 86%;
            }
        }
    </style>
</head>
<body>

<div class="wa-layout" id="waLayout">
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title-group">
                <span class="sidebar-title">Chats</span>
                <span class="new-count-pill" id="newPeopleCount">0 New</span>
            </div>
            <div class="header-tools">
                <button class="tool-btn" id="soundToggleBtn" onclick="toggleSound()">🔔 Sound ON</button>
                <button class="tool-btn" onclick="fetchConversationsFromSupabase(false)" title="Refresh now">↻</button>
            </div>
        </div>

        <div class="search-bar-wrap">
            <input type="text" id="searchInput" class="search-input" placeholder="Search or start new chat" oninput="renderContacts()" />
        </div>

        <div class="contact-list" id="contactList"></div>
    </div>

    <div class="chat-pane" id="chatPane">
        <div class="empty-pane" id="emptyPane">
            <h2>Connection Platform Chats</h2>
            <p>Newest chats appear at the top. Click any contact to view the last time they chatted, their messages on the left, and Mercy's AI replies on the right.</p>
        </div>

        <div id="activeChatView" style="display: none; flex-direction: column; height: 100%;">
            <div class="chat-pane-header">
                <button class="back-btn" onclick="closeMobileChat()">←</button>
                <div class="contact-avatar" id="activeAvatar">V</div>
                <div class="pane-user-meta">
                    <div class="pane-user-name" id="activeName">Visitor</div>
                    <div class="pane-user-sub" id="activeSub">Last chatted</div>
                </div>
            </div>
            <div class="messages-feed" id="messagesFeed"></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://eupaqmrilobhvmbpvpuw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PjtLrDn-bHNoz9hm5FM_yQ_LI8NUxrU";

    let conversations = [];
    let selectedChatId = null;
    let soundEnabled = true;
    let lastKnownCount = 0;

    function playNotificationChime() {
        if (!soundEnabled) return;
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1174.66, ctx.currentTime + 0.14);
            gain.gain.setValueAtTime(0.18, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.36);
        } catch (e) {}
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        const btn = document.getElementById('soundToggleBtn');
        btn.textContent = soundEnabled ? '🔔 Sound ON' : '🔕 Muted';
        btn.classList.toggle('muted', !soundEnabled);
        if (soundEnabled) playNotificationChime();
    }

    async function fetchConversationsFromSupabase(shouldAlertOnNew = true) {
        try {
            const res = await fetch(
                `${SUPABASE_URL}/rest/v1/cp_conversations?select=*&order=last_message_at.desc`,
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                }
            );

            if (!res.ok) return;
            const rows = await res.json();
            conversations = Array.isArray(rows) ? rows : [];

            if (shouldAlertOnNew && conversations.length > lastKnownCount) {
                playNotificationChime();
            }
            lastKnownCount = conversations.length;

            const newCount = conversations.filter(c => c.is_new).length;
            document.getElementById('newPeopleCount').textContent = `${newCount} New (${conversations.length} Total)`;

            renderContacts();
            if (selectedChatId) {
                renderActiveThread(selectedChatId, false);
            }
        } catch (err) {
            console.error("Error loading Supabase chats:", err);
        }
    }

    function escapeHtml(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/\n/g, '<br>');
    }

    function renderContacts() {
        const listEl = document.getElementById('contactList');
        const query = document.getElementById('searchInput').value.trim().toLowerCase();

        const filtered = conversations.filter(c => {
            if (!query) return true;
            return (c.name || '').toLowerCase().includes(query) ||
                   (c.last_message || '').toLowerCase().includes(query) ||
                   (c.first_message || '').toLowerCase().includes(query);
        });

        if (filtered.length === 0) {
            listEl.innerHTML = `<div class="empty-sidebar">No chats found yet.<br>When a new person clicks your link and sends their first message, they will appear here automatically.</div>`;
            return;
        }

        listEl.innerHTML = filtered.map(c => {
            const isSelected = c.id === selectedChatId;
            const isUnread = (c.unread_count || 0) > 0 || c.is_new;
            const initials = (c.name || 'V').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || 'V';
            return `
                <div class="contact-item ${isSelected ? 'active' : ''} ${isUnread ? 'unread' : ''}" onclick="openConversation('${c.id}')">
                    <div class="contact-avatar">${initials}</div>
                    <div class="contact-info">
                        <div class="contact-top-row">
                            <span class="contact-name">${escapeHtml(c.name)}</span>
                            <span class="contact-time">${escapeHtml(c.last_time || c.started_at || '')}</span>
                        </div>
                        <div class="contact-bottom-row">
                            <span class="contact-preview">${escapeHtml(c.last_message || c.first_message || '')}</span>
                            ${(c.unread_count || 0) > 0 ? `<span class="unread-badge">${c.unread_count}</span>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function openConversation(chatId) {
        selectedChatId = chatId;
        const idx = conversations.findIndex(c => c.id === chatId);
        if (idx !== -1) {
            conversations[idx].unread_count = 0;
            conversations[idx].is_new = false;
        }

        document.getElementById('waLayout').classList.add('mobile-chat-open');
        renderContacts();
        renderActiveThread(chatId, true);

        try {
            await fetch(`${SUPABASE_URL}/rest/v1/cp_conversations?id=eq.${encodeURIComponent(chatId)}`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Prefer": "return=minimal"
                },
                body: JSON.stringify({ unread_count: 0, is_new: false })
            });
        } catch (err) {}
    }

    function closeMobileChat() {
        document.getElementById('waLayout').classList.remove('mobile-chat-open');
    }

    function renderActiveThread(chatId, scrollToBottom = true) {
        const convo = conversations.find(c => c.id === chatId);
        if (!convo) return;

        document.getElementById('emptyPane').style.display = 'none';
        const activeView = document.getElementById('activeChatView');
        activeView.style.display = 'flex';

        document.getElementById('activeAvatar').textContent = (convo.name || 'V').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || 'V';
        document.getElementById('activeName').textContent = convo.name || 'Visitor';
        document.getElementById('activeSub').textContent = `Last chatted: ${convo.last_time || ''} • Last message: "${convo.last_message || ''}"`;

        const feedEl = document.getElementById('messagesFeed');
        const msgs = Array.isArray(convo.messages) ? convo.messages : [];

        feedEl.innerHTML = msgs.map(m => {
            const isAi = m.role === 'assistant';
            return `
                <div class="msg-bubble ${isAi ? 'ai' : 'visitor'}">
                    <div class="msg-sender-tag">${isAi ? 'Mercy (AI)' : escapeHtml(convo.name || 'Visitor')}</div>
                    <div>${escapeHtml(m.content)}</div>
                    <div class="msg-time">${escapeHtml(m.time || '')}</div>
                </div>
            `;
        }).join('');

        if (scrollToBottom) {
            feedEl.scrollTop = feedEl.scrollHeight;
        }
    }

    fetchConversationsFromSupabase(false);
    setInterval(() => fetchConversationsFromSupabase(true), 3000);
</script>
</body>
</html>
