<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Connection Platform - Get Paid For Chatting</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --accent-gold: #D4AF37;
            --accent-gold-dark: #AA7C11;
            --dark-red: #8B0000;
            --text-color: #FFFFFF;
            --input-bg: #222222;
            --border-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { background: var(--bg-color); color: var(--text-color); width: 100%; height: 100%; touch-action: manipulation; overflow-x: hidden; }
        body { padding: 16px; max-width: 600px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1.5px solid var(--accent-gold); margin-bottom: 20px; }
        h1 { font-size: 18px; color: var(--accent-gold); font-weight: 800; text-transform: uppercase; }
        .nav-link { color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 700; }
        .refund-btn { background: var(--dark-red); color: #FFFFFF; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 800; border: 1px solid #B30000; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
        .profile-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1.5px solid var(--accent-gold); box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15); display: flex; flex-direction: column; }
        .profile-card img { width: 100%; height: 220px; object-fit: contain; background: #000000; }
        .profile-card .info { padding: 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-dark) 100%); color: #000000; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 8px; font-size: 14px; box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; padding: 16px; z-index: 999; }
        .modal-box { background: var(--card-bg); border: 1.5px solid var(--accent-gold); padding: 24px; border-radius: 16px; width: 100%; max-width: 440px; text-align: center; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2); }
        .modal-box h3 { margin-bottom: 12px; color: var(--accent-gold); font-size: 20px; font-weight: 800; text-transform: uppercase; }
        .modal-box p { font-size: 15px; color: #FFFFFF !important; font-weight: 700; margin-bottom: 16px; line-height: 1.5; text-align: left; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 48px; height: 48px; border-radius: 50%; border-left-color: var(--accent-gold); animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .close-btn { background: transparent; color: #FFFFFF; border: none; margin-top: 14px; cursor: pointer; font-size: 14px; font-weight: 700; text-decoration: underline; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="nav-link">&larr; Back to Chat</a>
    <h1 id="pageTitle">Get Paid For Chatting</h1>
    <a href="mailto:connectionplatform.ng@gmail.com?subject=Refund%20Request" class="refund-btn">Request Refund</a>
</header>

<div class="grid-container" id="galleryGrid"></div>

<div class="modal-overlay" id="flowModal">
    <div class="modal-box" id="modalContent"></div>
</div>

<script>
    const GITHUB_USERNAME = "gempluto";
    const REPO_NAME = "my-project";
    let categoryKey = "paid_chat";

    window.addEventListener('DOMContentLoaded', () => { loadGalleryPhotos(); });

    async function loadGalleryPhotos() {
        const grid = document.getElementById('galleryGrid');
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#FFFFFF; font-weight:700;'>Loading profiles...</p>";
        try {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/images/${categoryKey}`);
            const files = await response.json();
            if (!Array.isArray(files)) { grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#FFFFFF; font-weight:700;'>No profiles available yet.</p>"; return; }
            const images = files.filter(f => f.name.match(/\.(jpg|jpeg|png|webp)$/i));
            grid.innerHTML = '';
            images.forEach((img) => {
                grid.innerHTML += `
                    <div class="profile-card">
                        <img src="${img.download_url}" alt="Match Profile">
                        <div class="info">
                            <button class="btn-primary" onclick="startConnectFlow('${img.download_url}')">Get Connected Now</button>
                        </div>
                    </div>
                `;
            });
        } catch (err) {
            grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#FFFFFF; font-weight:700;'>Error loading photos.</p>";
        }
    }

    function openModal() { document.getElementById('flowModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('flowModal').style.display = 'none'; }

    function startConnectFlow(imgUrl) {
        const modal = document.getElementById('modalContent');
        modal.innerHTML = `
            <h3>Upload Your Photo</h3>
            <p>please upload a picture of you so we can send it to the person you choose and confirm if your match is interested in getting connected with you:</p>
            <input type="file" id="userPhotoInput" accept="image/*" style="width:100%; padding:14px; background:#222; color:#fff; border-radius:8px; margin-bottom:14px;">
            <button class="btn-primary" onclick="processUpload()">Submit Photo</button>
            <br><button class="close-btn" onclick="closeModal()">Cancel</button>
        `;
        openModal();
    }

    function processUpload() {
        const fileInput = document.getElementById('userPhotoInput');
        if (!fileInput.files[0]) return alert("Please select a photo first.");
        const modal = document.getElementById('modalContent');
        modal.innerHTML = `
            <h3>Verifying Compatibility</h3>
            <div class="spinner"></div>
            <p style="text-align:center;">Please wait while we send your profile picture and check if the person you selected is interested in connecting with you...</p>
        `;
        setTimeout(() => { renderApprovalStep(); }, Math.floor(Math.random() * (30000 - 10000 + 1)) + 10000);
    }

    function renderApprovalStep() {
        const modal = document.getElementById('modalContent');
        modal.innerHTML = `
            <h3 style="color:#D4AF37;">Connection Approved! 🎉</h3>
            <p style="text-align:center;">Great news! The match you selected has confirmed their interest in connecting with you.</p>
            <button class="btn-primary" onclick="showConnectionFeeStep()">Click this button to get your match's contact</button>
        `;
    }

    function showConnectionFeeStep() {
        const modal = document.getElementById('modalContent');
        modal.innerHTML = `
            <h3>Connection Fee Agreement</h3>
            <p>Your match has approved their interest! To finalize, a connection fee of ₦3,000 is required to cover profile verification and you would be paid ₦210,000 per service. Do you agree?</p>
            <button class="btn-primary" onclick="window.location.href='index.html?returned=true&amount=3000'">YES, I AGREE (Pay ₦3,000)</button>
            <button class="close-btn" onclick="closeModal()">NO</button>
        `;
    }
</script>
</body>
</html>
