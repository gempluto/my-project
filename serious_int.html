<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Connection Platform - Match Gallery</title>
    <style>
        :root {
            --bg-color: #0b141a;
            --card-bg: #202c33;
            --accent-gold: #D4AF37;
            --accent-gold-dark: #AA7C11;
            --text-color: #e9edef;
            --border-color: #2a3942;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); padding: 16px; max-width: 600px; margin: 0 auto; padding-bottom: 90px; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1.5px solid var(--accent-gold); margin-bottom: 20px; }
        h1 { font-size: 18px; color: var(--accent-gold); font-weight: 800; text-transform: uppercase; }
        .nav-link { color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 700; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
        .profile-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 2px solid var(--border-color); cursor: pointer; position: relative; transition: border-color 0.2s; }
        .profile-card.selected { border-color: var(--accent-gold); box-shadow: 0 0 12px rgba(212, 175, 55, 0.4); }
        .profile-card img { width: 100%; height: 220px; object-fit: cover; background: #000000; display: block; }
        .checkmark { position: absolute; top: 10px; right: 10px; background: var(--accent-gold); color: #000; width: 28px; height: 28px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
        .profile-card.selected .checkmark { display: flex; }
        .floating-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #202c33; padding: 16px; border-top: 1px solid var(--border-color); display: flex; justify-content: center; z-index: 1000; }
        .send-btn { background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-dark) 100%); color: #000000; border: none; width: 100%; max-width: 480px; padding: 14px; border-radius: 8px; font-weight: 800; font-size: 15px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="nav-link">&larr; Back to Chat</a>
    <h1 id="pageTitle">Match Gallery</h1>
    <div></div>
</header>

<div class="grid-container" id="galleryGrid"></div>

<div class="floating-footer">
    <button class="send-btn" id="sendBtn" onclick="sendSelectedPhotos()" disabled>Select Photos to Send (0)</button>
</div>

<script>
    const GITHUB_USERNAME = "gempluto";
    const REPO_NAME = "my-project";

    let categoryKey = window.location.pathname.split('/').pop().replace('.html', '') || 'sugar_mommy';
    let selectedPhotos = new Set();

    window.addEventListener('DOMContentLoaded', () => {
        const catName = localStorage.getItem('selected_category_name') || categoryKey.replace('_', ' ').toUpperCase();
        document.getElementById('pageTitle').innerText = catName;
        loadGalleryPhotos();
    });

    async function loadGalleryPhotos() {
        const grid = document.getElementById('galleryGrid');
        grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#8696a0;'>Loading profiles...</p>";

        try {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/images/${categoryKey}`);
            const files = await response.json();

            if (!Array.isArray(files)) {
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#8696a0;'>No profiles available yet.</p>";
                return;
            }

            const images = files.filter(f => f.name.match(/\.(jpg|jpeg|png|webp)$/i));
            if (images.length === 0) {
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#8696a0;'>No profiles uploaded yet.</p>";
                return;
            }

            grid.innerHTML = '';
            images.forEach((img) => {
                grid.innerHTML += `
                    <div class="profile-card" onclick="toggleSelect(this, '${img.download_url}')">
                        <div class="checkmark">✓</div>
                        <img src="${img.download_url}" alt="Match Profile">
                    </div>
                `;
            });
        } catch (err) {
            grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#8696a0;'>Error loading photos.</p>";
        }
    }

    function toggleSelect(cardElement, url) {
        if (selectedPhotos.has(url)) {
            selectedPhotos.delete(url);
            cardElement.classList.remove('selected');
        } else {
            selectedPhotos.add(url);
            cardElement.classList.add('selected');
        }

        const count = selectedPhotos.size;
        const btn = document.getElementById('sendBtn');
        btn.innerText = `Send Selected Photos (${count})`;
        btn.disabled = count === 0;
    }

    function sendSelectedPhotos() {
        if (selectedPhotos.size === 0) return;
        localStorage.setItem('pending_match_images', JSON.stringify(Array.from(selectedPhotos)));
        window.location.href = 'index.html?returned=gallery';
    }
</script>
</body>
</html>
