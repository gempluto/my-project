<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Platform - Get Started</title>
    <style>
        :root {
            --bg-color: #0b141a;
            --card-bg: #202c33;
            --accent-color: #00a884;
            --text-color: #e9edef;
            --input-bg: #2a3942;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .form-card { background: var(--card-bg); width: 100%; max-width: 460px; padding: 24px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
        h2 { font-size: 20px; color: var(--accent-color); margin-bottom: 8px; text-align: center; }
        p.subtitle { font-size: 13px; color: #8696a0; text-align: center; margin-bottom: 20px; }
        .step { display: none; }
        .step.active { display: block; }
        label { display: block; font-size: 14px; margin-bottom: 8px; color: #8696a0; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--input-bg); color: var(--text-color); font-size: 15px; outline: none; margin-bottom: 16px; }
        .btn-primary { width: 100%; background: var(--accent-color); color: #111b21; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
        
        .category-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .category-btn { background: var(--input-bg); color: var(--text-color); border: 1px solid #3b4a54; padding: 12px; border-radius: 8px; text-align: left; font-size: 14px; cursor: pointer; transition: background 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .category-btn:hover { background: #32444f; }
        .price-badge { background: var(--accent-color); color: #111b21; padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

<div class="form-card">
    <!-- STEP 1: Name -->
    <div class="step active" id="step1">
        <h2>Welcome to Connection Platform</h2>
        <p class="subtitle">Please enter your basic profile information to continue.</p>
        <label for="userName">Question 1: What is your Full Name?</label>
        <input type="text" id="userName" placeholder="e.g. David Johnson" required>
        <button class="btn-primary" onclick="nextStep(1)">Next Step →</button>
    </div>

    <!-- STEP 2: Location -->
    <div class="step" id="step2">
        <h2>Your Location</h2>
        <p class="subtitle">We use this to match you with available connections near you.</p>
        <label for="userLocation">Question 2: Which city or state are you living in?</label>
        <input type="text" id="userLocation" placeholder="e.g. Lagos, Nigeria" required>
        <button class="btn-primary" onclick="nextStep(2)">Continue to Categories →</button>
    </div>

    <!-- STEP 3: Category Choice -->
    <div class="step" id="step3">
        <h2>Select Connection Type</h2>
        <p class="subtitle">Choose the category you want to view available profiles for:</p>
        
        <div class="category-list">
            <button class="category-btn" onclick="selectCategory('sugar_mommy.html', 'VIP Financial Support Match', 2000)">
                <span>1. VIP Financial Support Match</span>
                <span class="price-badge">₦2,000</span>
            </button>
            <button class="category-btn" onclick="selectCategory('social_group.html', 'VIP Social Group Access', 1500)">
                <span>2. VIP Social Group Access</span>
                <span class="price-badge">₦1,500</span>
            </button>
            <button class="category-btn" onclick="selectCategory('private_video.html', 'Private Video Connect', 1000)">
                <span>3. Private Video Connect</span>
                <span class="price-badge">₦1,000</span>
            </button>
            <button class="category-btn" onclick="selectCategory('casual_friendship.html', 'Casual Friendship Match', 1000)">
                <span>4. Casual Friendship Match</span>
                <span class="price-badge">₦1,000</span>
            </button>
            <button class="category-btn" onclick="selectCategory('media_exchange.html', 'Media Exchange Match', 1000)">
                <span>5. Media Exchange Match</span>
                <span class="price-badge">₦1,000</span>
            </button>
            <button class="category-btn" onclick="selectCategory('serious_ng.html', 'Serious Relationship (Nigeria)', 1000)">
                <span>6. Serious Relationship (Nigeria)</span>
                <span class="price-badge">₦1,000</span>
            </button>
            <button class="category-btn" onclick="selectCategory('serious_int.html', 'Serious Relationship (International)', 5000)">
                <span>7. Serious Relationship (Intl)</span>
                <span class="price-badge">₦5,000</span>
            </button>
            <button class="category-btn" onclick="selectCategory('paid_chat.html', 'International Paid Chat', 8000)">
                <span>8. International Paid Chat</span>
                <span class="price-badge">₦8,000</span>
            </button>
        </div>
    </div>
</div>

<script>
    function nextStep(current) {
        if (current === 1) {
            const name = document.getElementById('userName').value.trim();
            if (!name) return alert("Please enter your name.");
            localStorage.setItem('user_name', name);
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
        } else if (current === 2) {
            const location = document.getElementById('userLocation').value.trim();
            if (!location) return alert("Please enter your location.");
            localStorage.setItem('user_location', location);
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
        }
    }

    function selectCategory(pageUrl, categoryName, fee) {
        localStorage.setItem('selected_category_name', categoryName);
        localStorage.setItem('selected_category_fee', fee);
        window.location.href = pageUrl;
    }
</script>
</body>
</html>
