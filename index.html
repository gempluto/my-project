<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connection Platform</title>

    <!-- AUTOMATIC ROUTING: Skip this screen permanently once verified -->
    <script>
        if (localStorage.getItem('membership_id_verified') === 'true') {
            window.location.replace('chat.html' + window.location.search);
        }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, sans-serif; touch-action: manipulation; -webkit-font-smoothing: antialiased; }
        html, body { height: 100vh; height: 100dvh; background: #e8e2d9; color: #1c1b1a; display: flex; justify-content: center; align-items: center; overflow: hidden; position: fixed; width: 100%; top: 0; left: 0; }

        .ios-container { width: 100%; max-width: 428px; height: 100vh; height: 100dvh; background: #e8e2d9; display: flex; flex-direction: column; justify-content: center; padding: 28px 24px; overflow: hidden; }
        @media (min-width: 500px) { .ios-container { height: 884px; border-radius: 48px; border: 12px solid #2c2a29; box-shadow: 0 25px 60px rgba(0,0,0,0.2); } }

        .ios-content { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
        
        h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: #1c1b1a; }
        p { font-size: 15px; color: #3a3836; line-height: 1.45; font-weight: 500; max-width: 320px; }

        .ios-form-group { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 24px; }

        .ios-btn { width: 100%; background: #1c1b1a; color: #f5f2ed; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: transform 0.1s, opacity 0.2s; }
        .ios-btn:active { transform: scale(0.97); opacity: 0.9; }
    </style>
</head>
<body>

<div class="ios-container">
    <div class="ios-content">
        <h1>Connection Platform</h1>
        <p>Click the start button below to begin your connection and get connected with a partner.</p>
    </div>

    <div class="ios-form-group">
        <button type="button" class="ios-btn" onclick="startConnectionChat()">Start</button>
    </div>
</div>

<script>
    function startConnectionChat() {
        localStorage.removeItem('deepseek_chat_history');
        localStorage.removeItem('gallery_selection_completed');
        localStorage.setItem('membership_id_verified', 'true');
        window.location.replace('chat.html');
    }
</script>

</body>
</html>
