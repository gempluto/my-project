<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Prevents page zooming on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VIP Connection Platform</title>
  <!-- Paystack Inline Script -->
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* Prevent scrolling and zooming */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0B0B0B;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }

    /* Fixed centered viewport container (stops elements from moving up and down) */
    .app-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background-color: #161616;
      border: 1.5px solid #D4AF37; /* Gold Border */
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
      overflow-y: auto;
    }

    .card-title {
      color: #D4AF37; /* Gold */
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-subtitle {
      color: #FFFFFF !important; /* Pure White */
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .question-label {
      color: #FFFFFF !important; /* Pure White & Bold */
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
      display: block;
    }

    /* Minimum 16px font-size stops Safari/iOS automatic zooming */
    .input-field {
      width: 100%;
      background-color: #222222;
      border: 1px solid #444444;
      color: #FFFFFF;
      font-size: 16px !important;
      font-weight: 600;
      padding: 14px 16px;
      border-radius: 10px;
      outline: none;
      margin-bottom: 20px;
    }

    .input-field:focus {
      border-color: #D4AF37;
    }

    .btn-gold {
      width: 100%;
      background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
      color: #000000;
      font-size: 16px;
      font-weight: 800;
      padding: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    .btn-red {
      background: linear-gradient(135deg, #990000 0%, #660000 100%);
      color: #FFFFFF;
      border: 1px solid #B30000;
    }

    .btn-gallery {
      margin-bottom: 15px;
      background: #222222;
      border: 1px solid #D4AF37;
      color: #D4AF37;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      display: block;
    }

    /* Categories List */
    .category-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .category-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #222222;
      border: 1px solid #333333;
      padding: 14px 16px;
      border-radius: 10px;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .category-btn.unlocked {
      border-color: #D4AF37;
      background-color: #1f1a0a;
    }

    .price-badge {
      background-color: #8B0000; /* Dark Red */
      color: #FFFFFF;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
    }

    .unlocked .price-badge {
      background-color: #D4AF37;
      color: #000000;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- STEP 1: NAME -->
    <div id="step-1" class="card">
      <h2 class="card-title">Welcome</h2>
      <p class="card-subtitle">Please enter your profile details to continue.</p>
      
      <label class="question-label">Question 1: What is your Full Name?</label>
      <input type="text" id="user-name" class="input-field" placeholder="e.g. David Johnson">
      
      <button class="btn-gold" onclick="nextStep(2)">Next Step &rarr;</button>
    </div>

    <!-- STEP 2: LOCATION -->
    <div id="step-2" class="card hidden">
      <h2 class="card-title">Your Location</h2>
      <p class="card-subtitle">We use this to match you with available connections near you.</p>
      
      <label class="question-label">Question 2: Which city or state are you living in?</label>
      <input type="text" id="user-location" class="input-field" placeholder="e.g. Lagos, Nigeria">
      
      <button class="btn-gold" onclick="nextStep(3)">Continue to Categories &rarr;</button>
    </div>

    <!-- STEP 3: CATEGORIES & PAYMENT GATEWAY -->
    <div id="step-3" class="card hidden">
      <h2 class="card-title">Select Connection Type</h2>
      <p class="card-subtitle">Unlock a category to view available profiles and connect.</p>

      <!-- View Pictures Button -->
      <a href="gallery.html" class="btn-gallery">📷 View All Candidate Pictures</a>

      <div class="category-list" id="category-container">
        <!-- Rendered dynamically via JS -->
      </div>
    </div>
  </div>

  <script>
    const categories = [
      { id: 'sugar_mommy', name: '1. VIP Financial Support Match', price: 2000, page: 'sugar_mommy.html' },
      { id: 'vip_social', name: '2. VIP Social Group Access', price: 1500, page: 'vip_social.html' },
      { id: 'private_video', name: '3. Private Video Connect', price: 1000, page: 'private_video.html' },
      { id: 'casual_friendship', name: '4. Casual Friendship Match', price: 1000, page: 'casual_friendship.html' },
      { id: 'media_exchange', name: '5. Media Exchange Match', price: 1000, page: 'media_exchange.html' },
      { id: 'serious_ng', name: '6. Serious Relationship (Nigeria)', price: 1000, page: 'serious_ng.html' },
      { id: 'serious_int', name: '7. Serious Relationship (Intl)', price: 5000, page: 'serious_int.html' },
      { id: 'paid_chat', name: '8. International Paid Chat', price: 8000, page: 'paid_chat.html' }
    ];

    function nextStep(stepNumber) {
      if (stepNumber === 2) {
        const name = document.getElementById('user-name').value.trim();
        if (!name) return alert('Please enter your full name.');
        localStorage.setItem('user_name', name);
      }
      if (stepNumber === 3) {
        const loc = document.getElementById('user-location').value.trim();
        if (!loc) return alert('Please enter your location.');
        localStorage.setItem('user_location', loc);
        renderCategories();
      }

      document.getElementById('step-1').classList.add('hidden');
      document.getElementById('step-2').classList.add('hidden');
      document.getElementById('step-3').classList.add('hidden');

      document.getElementById(`step-${stepNumber}`).classList.remove('hidden');
    }

    function renderCategories() {
      const unlocked = JSON.parse(localStorage.getItem('unlocked_cats') || '[]');
      const container = document.getElementById('category-container');
      container.innerHTML = '';

      categories.forEach(cat => {
        const isUnlocked = unlocked.includes(cat.id);
        const btn = document.createElement('div');
        btn.className = `category-btn ${isUnlocked ? 'unlocked' : ''}`;
        btn.innerHTML = `
          <span>${cat.name}</span>
          <span class="price-badge">${isUnlocked ? 'UNLOCKED' : '₦' + cat.price.toLocaleString()}</span>
        `;
        btn.onclick = () => handleCategoryClick(cat);
        container.appendChild(btn);
      });
    }

    function handleCategoryClick(cat) {
      const unlocked = JSON.parse(localStorage.getItem('unlocked_cats') || '[]');

      if (unlocked.includes(cat.id)) {
        // Already paid -> Go directly to the HTML page
        window.location.href = cat.page;
      } else {
        // Prompt payment first
        if (confirm(`To access ${cat.name}, please pay the connection fee of ₦${cat.price.toLocaleString()}. Proceed to Paystack?`)) {
          payWithPaystack(cat);
        }
      }
    }

    function payWithPaystack(cat) {
      // Replace with your public key if needed
      let handler = PaystackPop.setup({
        key: 'pk_test_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx', 
        email: 'user@connectionplatform.com',
        amount: cat.price * 100, // Amount in kobo
        currency: 'NGN',
        callback: function(response) {
          alert('Payment successful! Category unlocked.');
          let unlocked = JSON.parse(localStorage.getItem('unlocked_cats') || '[]');
          unlocked.push(cat.id);
          localStorage.setItem('unlocked_cats', JSON.stringify(unlocked));
          renderCategories();
          window.location.href = cat.page;
        },
        onClose: function() {
          alert('Transaction canceled. Please make payment to access this category.');
        }
      });
      handler.openIframe();
    }
  </script>
</body>
</html>
