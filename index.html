<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <title>Connection Platform</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#202c33">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Connection Platform">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Client-side OCR for reading receipt screenshots directly in browser -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <!-- Mobile Config & Zoom Prevention -->
    <script>
        if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
            document.documentElement.classList.add('platform-ios');
        }

        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>

    <style>
        :root {
            --bg-body: #0b141a;
            --bg-container: #0b141a;
            --border-container: #222d34;
            --bg-header: #202c33;
            --text-header: #e9edef;
            --text-status: #8696a0;
            --bg-chat: #0b141a;
            --pattern-opacity: 0.02;
            --bg-user-msg: #005c4b;
            --text-user-msg: #e9edef;
            --bg-bot-msg: #202c33;
            --text-bot-msg: #e9edef;
            --text-loading: #8696a0;
            --bg-input-area: #202c33;
            --bg-input-wrapper: #2a3942;
            --text-input: #e9edef;
            --placeholder-input: #8696a0;
            --icon-color: #8696a0;
            --file-preview-bg: #1f2c34;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body.platform-ios { --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif; }
        body.platform-ios .message { border-radius: 14px; }
        body.platform-android { --font-family: Roboto, "Segoe UI", sans-serif; }
        body.platform-android .message { border-radius: 6px; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--bg-body);
            color: var(--text-bot-msg);
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            background: var(--bg-container);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 500px) {
            body { align-items: center; }
            .chat-container {
                height: 92vh;
                border-radius: 12px;
                border: 1px solid var(--border-container);
                box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            }
        }

        .chat-header {
            background: var(--bg-header);
            color: var(--text-header);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            height: 60px;
            min-height: 60px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-container);
            z-index: 20;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .header-info { flex: 1; display: flex; flex-direction: column; }
        .header-name { font-size: 16px; font-weight: 500; color: var(--text-header); }
        .header-status { font-size: 12px; color: var(--text-status); }

        .verify-overlay { position: fixed; inset: 0; background: var(--bg-container); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
        .verify-overlay.show { display: flex; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(0, 168, 132, 0.2); border-top-color: #00a884; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .verify-title { font-size: 18px; font-weight: 600; color: var(--text-header); margin-bottom: 8px; }
        .verify-subtitle { font-size: 13px; color: var(--text-status); line-height: 1.4; max-width: 320px; }

        .chat-box {
            flex: 1;
            min-height: 0;
            padding: 12px 16px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 8px;
            background-color: var(--bg-chat);
            background-image: radial-gradient(circle, rgba(0,0,0,var(--pattern-opacity)) 1px, transparent 1px);
            background-size: 24px 24px;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 85%;
            padding: 8px 10px;
            font-size: 14.5px;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
            -webkit-user-select: text;
            user-select: text;
        }
        .message.user { background: var(--bg-user-msg); color: var(--text-user-msg); align-self: flex-end; border-top-right-radius: 0; }
        .message.bot { background: var(--bg-bot-msg); color: var(--text-bot-msg); align-self: flex-start; border-top-left-radius: 0; }
        .message.loading { color: var(--text-loading); font-style: italic; background: var(--bg-bot-msg); }

        .message img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 6px; margin-bottom: 4px; display: block; cursor: pointer; }

        .persistent-btn-area { display: none; padding: 12px 16px; background: var(--bg-input-area); border-top: 1.5px solid #D4AF37; text-align: center; flex-shrink: 0; }
        .match-gallery-btn { background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%); color: #000000; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: 800; display: block; width: 100%; font-size: 15px; text-transform: uppercase; box-shadow: 0 2px 10px rgba(212, 175, 55, 0.4); }

        .copy-btn { background: rgba(0, 168, 132, 0.2); color: #00a884; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(0, 168, 132, 0.4); margin: 2px 0; font-size: 13px; }

        #file-preview { display: none; background: var(--file-preview-bg); color: var(--text-bot-msg); padding: 6px 16px; font-size: 13px; border-top: 1px solid var(--border-container); align-items: center; justify-content: space-between; flex-shrink: 0; }
        #file-preview span { cursor: pointer; color: #f87171; font-weight: bold; }

        .input-area {
            background: var(--bg-input-area);
            padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 62px;
            flex-shrink: 0;
            z-index: 20;
        }
        .input-box-wrapper { flex: 1; background: var(--bg-input-wrapper); border-radius: 8px; display: flex; align-items: center; padding: 0 12px; gap: 8px; }
        input[type="text"] { flex: 1; background: transparent; border: none; outline: none; color: var(--text-input); font-size: 16px; padding: 10px 0; -webkit-appearance: none; }
        input[type="text"]::placeholder { color: var(--placeholder-input); }
        .whatsapp-icon-btn { background: none; border: none; color: var(--icon-color); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; padding: 4px; }
        
        .mic-send-btn { background: #00a884; color: #ffffff; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; flex-shrink: 0; transition: background 0.2s; touch-action: manipulation; }
        .mic-send-btn.recording { background: #ef4444; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .input-area.disabled { opacity: 0.4; pointer-events: none; }
    </style>
</head>
<body>

<div class="chat-container" id="chatContainer">
    <div class="chat-header">
        <div class="avatar">
            <img src="icon.png" alt="Profile" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%238696a0\'><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/></svg>'">
        </div>
        <div class="header-info">
            <div class="header-name">Connection Platform</div>
            <div class="header-status" id="headerStatus">online</div>
        </div>
    </div>

    <div id="chatBox" class="chat-box"></div>
    
    <div id="persistentButtonArea" class="persistent-btn-area">
        <a id="persistentLinkBtn" href="#" class="match-gallery-btn">Click Here to Open Match Gallery</a>
    </div>

    <div id="file-preview">
        <span id="file-name">file.png</span>
        <span onclick="clearFile()">✕ Remove</span>
    </div>

    <input type="file" id="fileInput" accept="image/*,application/pdf,.doc,.docx" style="display: none;" onchange="handleFileSelect(this)" />

    <div class="input-area" id="inputAreaBox">
        <button class="whatsapp-icon-btn" onclick="document.getElementById('fileInput').click()" title="Attach File">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>

        <div class="input-box-wrapper">
            <input type="text" id="messageInput" placeholder="Type a message" oninput="toggleInputButton()" />
            <button class="whatsapp-icon-btn" onclick="document.getElementById('fileInput').click()" title="Camera">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            </button>
        </div>

        <button class="mic-send-btn" id="mainActionBtn" title="Hold to Record / Tap to Send">
            <svg id="micIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </button>
    </div>
</div>

<div id="verifyOverlay" class="verify-overlay">
    <div class="spinner"></div>
    <div class="verify-title">Verifying Connection...</div>
    <div class="verify-subtitle">Please wait while our system submits your photo and verifies availability with your match.</div>
</div>

<script>
    const API_KEY = "";
    const DEEPSEEK_API_URL = "https://api.deepseek.com/chat/completions";
    const BACKEND_CHAT_URL = "/api/chat";

    const SUPABASE_URL = "https://eupaqmrilobhvmbpvpuw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PjtLrDn-bHNoz9hm5FM_yQ_LI8NUxrU";

    const WELCOME_MSG_1 = `We can connect you with 
1. Sugar mommy or Sugar daddy
2. Hookup girls group
3. Sex video call
4. Friends with benefits 
5. Sex video and sex tape group 
6. Serious relationship in Nigeria 
7. Serious relationship outside Nigeria
8. Get paid chatting with rich people abroad`;

    const WELCOME_MSG_2 = "So What's your name and which city are you living in?";

    let welcomeTimer1 = null;
    let welcomeTimer2 = null;

    function syncViewportHeight() {
        const container = document.getElementById('chatContainer');
        if (!container) return;
        if (window.innerWidth >= 500) {
            container.style.height = '92vh';
            container.style.transform = '';
            return;
        }
        if (window.visualViewport) {
            container.style.height = `${window.visualViewport.height}px`;
            container.style.transform = `translateY(${window.visualViewport.offsetTop}px)`;
        } else {
            container.style.height = `${window.innerHeight}px`;
            container.style.transform = '';
        }
    }

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewportHeight);
        window.visualViewport.addEventListener('scroll', syncViewportHeight);
    }
    window.addEventListener('resize', syncViewportHeight);

    function formatClockTime(dateObj = new Date()) {
        return dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    let chatHistory = [];
    try {
        const savedHistory = localStorage.getItem('deepseek_chat_history');
        if (savedHistory) {
            chatHistory = JSON.parse(savedHistory).filter(m => m.role !== 'system');
        }
    } catch (e) {
        chatHistory = [];
    }

    const hasOldPreVerifiedIntro =
        Array.isArray(chatHistory) &&
        chatHistory.length >= 1 &&
        typeof chatHistory[0]?.content === 'string' &&
        chatHistory[0].content.startsWith('My Membership ID is');

    if (hasOldPreVerifiedIntro) {
        localStorage.removeItem('membership_fee_paid');
        localStorage.removeItem('gallery_selection_completed');
        localStorage.removeItem('unlocked_gallery_url');
        localStorage.removeItem('unlocked_gallery_name');
        localStorage.removeItem('pending_category_page');
        localStorage.removeItem('pending_category_name');
        chatHistory = [];
        saveChatHistory();
    }

    let pendingCategoryPage = localStorage.getItem('pending_category_page') || '';
    let pendingCategoryName = localStorage.getItem('pending_category_name') || '';
    let usedReceiptNumbers = JSON.parse(localStorage.getItem('used_receipt_numbers')) || [];
    let isSending = false;

    async function syncConversationToSupabase(firstUserText = "") {
        try {
            let visitorId = localStorage.getItem('cp_visitor_id');
            let visitorName = localStorage.getItem('cp_visitor_name');

            if (!visitorId) {
                visitorId = 'visitor_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
                localStorage.setItem('cp_visitor_id', visitorId);
            }

            if (!visitorName) {
                const suffix = visitorId.slice(-4).toUpperCase();
                visitorName = 'Visitor #' + suffix;
                localStorage.setItem('cp_visitor_name', visitorName);
            }

            const nowIso = new Date().toISOString();
            const nowClock = formatClockTime();
            const mappedMessages = chatHistory
                .filter(m => m.role === 'user' || m.role === 'assistant')
                .map(m => ({
                    role: m.role,
                    content: stripAsterisks(m.displayCaption || m.content || ''),
                    time: m.time || nowClock
                }));

            const latestMsg = mappedMessages[mappedMessages.length - 1];
            const firstUserMsgObj = mappedMessages.find(m => m.role === 'user');
            const firstMsgText = firstUserText || (firstUserMsgObj ? firstUserMsgObj.content : 'Opened website');
            const lastMsgText = latestMsg ? latestMsg.content : firstMsgText;

            const rowPayload = {
                id: visitorId,
                name: visitorName,
                started_at: nowClock,
                last_time: nowClock,
                last_message_at: nowIso,
                first_message: firstMsgText.slice(0, 200),
                last_message: lastMsgText.slice(0, 200),
                unread_count: latestMsg && latestMsg.role === 'user' ? 1 : 0,
                is_new: true,
                messages: mappedMessages
            };

            await fetch(`${SUPABASE_URL}/rest/v1/cp_conversations?on_conflict=id`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Prefer": "resolution=merge-duplicates,return=minimal"
                },
                body: JSON.stringify(rowPayload)
            });
        } catch (err) {
            console.error("Supabase sync error:", err);
        }
    }

    function startAutoWelcomeSequence() {
        if (welcomeTimer1) clearTimeout(welcomeTimer1);
        if (welcomeTimer2) clearTimeout(welcomeTimer2);

        const headerStatus = document.getElementById('headerStatus');
        if (headerStatus) headerStatus.textContent = 'typing...';
        appendLoadingMessage('Typing...');

        welcomeTimer1 = setTimeout(async () => {
            removeLoadingMessage();
            if (headerStatus) headerStatus.textContent = 'online';

            if (chatHistory.length === 0) {
                chatHistory.push({
                    role: "assistant",
                    content: WELCOME_MSG_1,
                    time: formatClockTime()
                });
                saveChatHistory();
                renderChatMessages();
                await syncConversationToSupabase("Opened website");
            }

            welcomeTimer2 = setTimeout(async () => {
                const hasSecondMsg = chatHistory.some(m => m.content === WELCOME_MSG_2);
                if (!hasSecondMsg) {
                    if (headerStatus) headerStatus.textContent = 'typing...';
                    appendLoadingMessage('Typing...');

                    setTimeout(async () => {
                        removeLoadingMessage();
                        if (headerStatus) headerStatus.textContent = 'online';

                        chatHistory.push({
                            role: "assistant",
                            content: WELCOME_MSG_2,
                            time: formatClockTime()
                        });
                        saveChatHistory();
                        renderChatMessages();
                        await syncConversationToSupabase();
                    }, 600);
                }
            }, 5000);
        }, 600);
    }

    window.addEventListener('DOMContentLoaded', () => {
        syncViewportHeight();
        loadChatHistory();
        checkPersistentButtonState();
        checkReturnHandshake();
        initSpeechRecognition();

        if (chatHistory.length === 0) {
            startAutoWelcomeSequence();
        } else if (chatHistory.length === 1 && chatHistory[0].content === WELCOME_MSG_1) {
            welcomeTimer2 = setTimeout(async () => {
                const hasSecondMsg = chatHistory.some(m => m.content === WELCOME_MSG_2);
                if (!hasSecondMsg) {
                    chatHistory.push({
                        role: "assistant",
                        content: WELCOME_MSG_2,
                        time: formatClockTime()
                    });
                    saveChatHistory();
                    renderChatMessages();
                    await syncConversationToSupabase();
                }
            }, 5000);
        }
    });

    function loadChatHistory() { renderChatMessages(); }

    function saveChatHistory() {
        try {
            localStorage.setItem('deepseek_chat_history', JSON.stringify(chatHistory));
        } catch (e) {
            console.error('Storage error:', e);
        }
    }

    function stripAsterisks(str) {
        return str ? str.replace(/\*/g, '') : '';
    }

    function renderChatMessages() {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        chatHistory.forEach(msg => {
            if (msg.role === 'system') return;
            const div = document.createElement('div');
            div.className = `message ${msg.role === 'assistant' ? 'bot' : 'user'}`;
            
            if (msg.imageUrl) {
                div.innerHTML = `<img src="${msg.imageUrl}" onclick="window.open('${msg.imageUrl}', '_blank')">${formatText(msg.displayCaption || '')}`;
            } else {
                div.innerHTML = formatText(msg.content);
            }

            chatBox.appendChild(div);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function checkPersistentButtonState() {
        const isPaid = localStorage.getItem('membership_fee_paid') === 'true';
        const galleryCompleted = localStorage.getItem('gallery_selection_completed') === 'true';
        const savedUrl = localStorage.getItem('unlocked_gallery_url') || pendingCategoryPage;
        const savedName = localStorage.getItem('unlocked_gallery_name') || pendingCategoryName;
        
        const area = document.getElementById('persistentButtonArea');
        const btn = document.getElementById('persistentLinkBtn');
        const inputAreaBox = document.getElementById('inputAreaBox');

        if (galleryCompleted || window.location.search.includes('returned=gallery')) {
            area.style.display = 'none';
            inputAreaBox.classList.remove('disabled');
            return;
        }

        if (isPaid && savedUrl) {
            btn.href = savedUrl;
            btn.innerText = `Click Here to Open ${savedName || 'Match'} Gallery`;
            area.style.display = 'block';
            inputAreaBox.classList.add('disabled');
        } else {
            area.style.display = 'none';
            inputAreaBox.classList.remove('disabled');
        }
    }

    function checkReturnHandshake() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('returned') === 'gallery') {
            localStorage.setItem('gallery_selection_completed', 'true');
            const savedImages = JSON.parse(localStorage.getItem('pending_match_images') || '[]');
            const photoCount = savedImages.length;
            
            if (savedImages.length > 0) {
                savedImages.forEach(imgUrl => {
                    chatHistory.push({
                        role: "user",
                        content: "Here is the picture of the person I am interested in.",
                        imageUrl: imgUrl,
                        displayCaption: "Here is the picture of the person I am interested in.",
                        time: formatClockTime()
                    });
                });
                localStorage.removeItem('pending_match_images');
            }

            const activeCat = localStorage.getItem('pending_category_name') || 'Serious Relationship in Nigeria';
            saveChatHistory();
            syncConversationToSupabase("Selected match from gallery");
            window.history.replaceState({}, document.title, window.location.pathname);
            
            const inputAreaBox = document.getElementById('inputAreaBox');
            if (inputAreaBox) inputAreaBox.classList.remove('disabled');
            const area = document.getElementById('persistentButtonArea');
            if (area) {
                area.style.display = 'none';
            }

            triggerDeepSeekResponse({
                eventType: "gallery_return",
                activeCategory: activeCat,
                photoCount: photoCount
            });
        }
    }

    function handleFileSelect(input) {
        if (input.files && input.files[0]) {
            document.getElementById('file-name').textContent = input.files[0].name;
            document.getElementById('file-preview').style.display = 'flex';
            toggleInputButton();
        }
    }

    function clearFile() {
        document.getElementById('fileInput').value = '';
        document.getElementById('file-preview').style.display = 'none';
        toggleInputButton();
    }

    function toggleInputButton() {
        const text = document.getElementById('messageInput').value.trim();
        const file = document.getElementById('fileInput').files[0];
        const btn = document.getElementById('mainActionBtn');
        
        if (text || file) {
            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
        } else if (!isRecording) {
            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>`;
        }
    }

    let recognition = null;
    let isRecording = false;
    const actionBtn = document.getElementById('mainActionBtn');

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-NG';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isRecording = true;
                actionBtn.classList.add('recording');
                actionBtn.innerHTML = `⏹`;
            };

            recognition.onresult = (event) => {
                const speechText = event.results[0][0].transcript.trim();
                if (speechText) {
                    document.getElementById('messageInput').value = speechText;
                    sendMessage();
                }
            };

            recognition.onerror = () => { stopSpeechRecognition(); };
            recognition.onend = () => { stopSpeechRecognition(); };
        }
    }

    function startSpeechRecognition() {
        if (recognition && !isRecording) {
            try { recognition.start(); } catch (e) { isRecording = false; actionBtn.classList.remove('recording'); }
        } else if (!recognition) {
            alert("Speech recognition is not supported on this browser.");
        }
    }

    function stopSpeechRecognition() {
        isRecording = false;
        actionBtn.classList.remove('recording');
        toggleInputButton();
        if (recognition) { try { recognition.stop(); } catch(e) {} }
    }

    actionBtn.addEventListener('pointerdown', (e) => {
        const text = document.getElementById('messageInput').value.trim();
        const file = document.getElementById('fileInput').files[0];
        if (!text && !file) { e.preventDefault(); startSpeechRecognition(); }
    });

    actionBtn.addEventListener('pointerup', (e) => { if (isRecording) { e.preventDefault(); stopSpeechRecognition(); } });

    actionBtn.addEventListener('click', () => {
        const text = document.getElementById('messageInput').value.trim();
        const file = document.getElementById('fileInput').files[0];
        if (text || file) { sendMessage(); }
    });

    document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    function extractReceiptNumber(text) {
        if (!text) return null;
        const patterns = [
            /(?:Transaction\s*No\.?|Session\s*ID|Ref\s*No\.?|Txn\s*ID|Reference)\s*[:\s]*([A-Za-z0-9]{10,35})/i,
            /\b(202\d{10,25})\b/,
            /\b([0-9]{15,30})\b/
        ];
        for (let pattern of patterns) {
            const match = text.match(pattern);
            if (match && match[1]) return match[1].trim();
        }
        return null;
    }

    async function sendMessage() {
        if (isSending) return;

        const textInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');
        const text = textInput.value.trim();
        const file = fileInput.files[0];

        if (!text && !file) return;

        if (welcomeTimer1) clearTimeout(welcomeTimer1);
        if (welcomeTimer2) clearTimeout(welcomeTimer2);
        removeLoadingMessage();

        if (!file && (text.toLowerCase() === 'reset' || text === '3334')) {
            textInput.value = '';
            toggleInputButton();
            localStorage.removeItem('cp_visitor_id');
            localStorage.removeItem('cp_visitor_name');
            localStorage.removeItem('membership_fee_paid');
            localStorage.removeItem('gallery_selection_completed');
            localStorage.removeItem('unlocked_gallery_url');
            localStorage.removeItem('unlocked_gallery_name');
            localStorage.removeItem('pending_category_page');
            localStorage.removeItem('pending_category_name');
            pendingCategoryPage = '';
            pendingCategoryName = '';
            chatHistory = [];
            saveChatHistory();
            renderChatMessages();
            checkPersistentButtonState();
            startAutoWelcomeSequence();
            return;
        }

        isSending = true;

        let apiUserPayload = text || "Uploaded image/receipt";
        let displayObj = { role: "user", content: text, time: formatClockTime() };
        const attachedFile = file;

        if (attachedFile && attachedFile.type.startsWith('image/')) {
            const imgUrl = URL.createObjectURL(attachedFile);
            displayObj.imageUrl = imgUrl;
            displayObj.displayCaption = text || "Sent a photo";
        }

        displayObj.content = apiUserPayload;
        chatHistory.push(displayObj);

        textInput.value = '';
        clearFile();
        toggleInputButton();
        saveChatHistory();
        await syncConversationToSupabase(text || "Uploaded image/receipt");
        renderChatMessages();

        const lastBotMsg = chatHistory.length >= 2 ? chatHistory[chatHistory.length - 2].content.toLowerCase() : '';
        const isPersonalPhotoSubmission = attachedFile && (lastBotMsg.includes('picture of yourself') || lastBotMsg.includes('photo of yourself'));

        if (attachedFile && attachedFile.type.startsWith('image/')) {
            appendLoadingMessage('Typing...');
            try {
                const ocrResult = await Tesseract.recognize(attachedFile, 'eng');
                const extractedText = ocrResult.data.text;
                apiUserPayload += ` [Backend OCR Extracted Text: ${extractedText}]`;

                const receiptNo = extractReceiptNumber(extractedText);
                if (receiptNo) {
                    if (usedReceiptNumbers.includes(receiptNo)) {
                        removeLoadingMessage();
                        const duplicateMsg = "This receipt has already been used by a different user. Please make your payment and send a valid receipt.";
                        chatHistory.push({ role: "assistant", content: duplicateMsg, time: formatClockTime() });
                        saveChatHistory();
                        await syncConversationToSupabase();
                        renderChatMessages();
                        isSending = false;
                        return;
                    } else {
                        usedReceiptNumbers.push(receiptNo);
                        localStorage.setItem('used_receipt_numbers', JSON.stringify(usedReceiptNumbers));
                    }
                }
            } catch(e) {
                apiUserPayload += ` [Backend Image Uploaded]`;
            }
            chatHistory[chatHistory.length - 1].content = apiUserPayload;
            saveChatHistory();
        } else {
            appendLoadingMessage('Typing...');
        }

        if (isPersonalPhotoSubmission) {
            removeLoadingMessage();
            isSending = false;
            
            const verifyOverlay = document.getElementById('verifyOverlay');
            verifyOverlay.classList.add('show');

            const randomWaitTime = Math.floor(Math.random() * (50000 - 10000 + 1)) + 10000;

            setTimeout(() => {
                verifyOverlay.classList.remove('show');
                const activeCat = localStorage.getItem('pending_category_name') || 'Serious Relationship in Nigeria';
                appendLoadingMessage('Typing...');
                triggerDeepSeekResponse({
                    eventType: "photo_approved",
                    activeCategory: activeCat
                });
            }, randomWaitTime);

            return;
        }

        triggerDeepSeekResponse();
    }

    async function triggerDeepSeekResponse(meta = {}) {
        const cleanApiPayload = chatHistory
            .filter(msg => msg.role === 'user' || msg.role === 'assistant')
            .map(msg => ({
                role: msg.role,
                content: stripAsterisks(msg.content || 'Image attached')
            }));

        try {
            const useDirectApi = Boolean(API_KEY && API_KEY.trim() !== "");
            const endpoint = useDirectApi ? DEEPSEEK_API_URL : BACKEND_CHAT_URL;
            const headers = { "Content-Type": "application/json" };
            if (useDirectApi) {
                headers["Authorization"] = `Bearer ${API_KEY}`;
            }

            const payload = useDirectApi
                ? {
                    model: "deepseek-chat",
                    messages: cleanApiPayload,
                    stream: false
                }
                : {
                    messages: cleanApiPayload,
                    eventType: meta.eventType || "chat",
                    activeCategory: meta.activeCategory || "",
                    photoCount: meta.photoCount || 0
                };

            const response = await fetch(endpoint, {
                method: "POST",
                headers,
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            removeLoadingMessage();

            if (!response.ok || data.error) {
                throw new Error(data.error || `Server error (${response.status})`);
            }

            let reply = data.choices && data.choices[0] && data.choices[0].message
                ? data.choices[0].message.content
                : "No reply received from server.";
            
            let shouldUnlockButton = false;
            if (reply.includes('[PAYMENT_VERIFIED_UNLOCK]')) {
                shouldUnlockButton = true;
                reply = reply.replace('[PAYMENT_VERIFIED_UNLOCK]', '');
            }

            let shouldShowChangeButton = false;
            if (reply.includes('[SHOW_CHANGE_MATCH_BUTTON]')) {
                shouldShowChangeButton = true;
                reply = reply.replace('[SHOW_CHANGE_MATCH_BUTTON]', '');
            }

            reply = stripAsterisks(reply);

            chatHistory.push({ role: "assistant", content: reply, time: formatClockTime() });
            saveChatHistory();
            await syncConversationToSupabase();
            renderChatMessages();

            trackCategoryChoice(reply, chatHistory[chatHistory.length - 2]?.content || '');

            if (shouldUnlockButton && pendingCategoryPage) {
                unlockGalleryButton();
            }

            if (shouldShowChangeButton && pendingCategoryPage) {
                showChangeMatchButton();
            }

        } catch (err) {
            removeLoadingMessage();
            const errText = err && err.message ? err.message : "Network connection error. Please try again.";
            chatHistory.push({ role: "assistant", content: `Error: ${errText}`, time: formatClockTime() });
            saveChatHistory();
            await syncConversationToSupabase();
            renderChatMessages();
        } finally {
            isSending = false;
        }
    }

    function trackCategoryChoice(botReply, userMsg) {
        const raw = (botReply + " " + userMsg).toLowerCase();
        const routes = [
            { match: ["sugar", "mommy", "daddy", "2000"], page: "sugar_mommy.html", title: "VIP Lounge" },
            { match: ["chat", "rich people abroad", "8000"], page: "paid_chat.html", title: "Global Chat" },
            { match: ["outside nigeria", "5000"], page: "serious_int.html", title: "Intl Matches" },
            { match: ["hookup", "benefit", "video call", "tape", "1500", "1000"], page: "media_exchange.html", title: "Private Room" },
            { match: ["relationship in nigeria", "serious relationship in nigeria"], page: "serious_ng.html", title: "Local Matches" }
        ];

        for (const item of routes) {
            if (item.match.some(term => raw.includes(term))) {
                pendingCategoryPage = item.page;
                pendingCategoryName = item.title;
                break;
            }
        }

        if (pendingCategoryPage) {
            localStorage.setItem("pending_category_page", pendingCategoryPage);
            localStorage.setItem("pending_category_name", pendingCategoryName);
        }
    }

    function unlockGalleryButton() {
        if (!pendingCategoryPage) return;
        localStorage.setItem('membership_fee_paid', 'true');
        localStorage.setItem('unlocked_gallery_url', pendingCategoryPage);
        localStorage.setItem('unlocked_gallery_name', pendingCategoryName);
        
        const area = document.getElementById('persistentButtonArea');
        const btn = document.getElementById('persistentLinkBtn');
        const inputAreaBox = document.getElementById('inputAreaBox');

        btn.href = pendingCategoryPage;
        btn.innerText = `Click Here to Open ${pendingCategoryName} Gallery`;
        area.style.display = 'block';
        inputAreaBox.classList.add('disabled');
    }

    function showChangeMatchButton() {
        if (!pendingCategoryPage) return;
        const savedUrl = localStorage.getItem('unlocked_gallery_url') || pendingCategoryPage;
        const savedName = localStorage.getItem('unlocked_gallery_name') || 'Match';
        
        const area = document.getElementById('persistentButtonArea');
        const btn = document.getElementById('persistentLinkBtn');
        const inputAreaBox = document.getElementById('inputAreaBox');

        btn.href = savedUrl;
        btn.innerText = `Click Here to Open ${savedName} Gallery`;
        area.style.display = 'block';
        inputAreaBox.classList.add('disabled');
    }

    function formatText(text) {
        if (!text) return '';
        let html = stripAsterisks(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        html = html.replace(/6765911129/g, `<span class="copy-btn" onclick="copyAccount('6765911129', this)">6765911129 📋</span>`);

        const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/g;
        html = html.replace(urlRegex, url => `<a href="${url}" target="_blank">${url}</a>`);
        return html.replace(/\n/g, '<br>');
    }

    function copyAccount(accNum, el) {
        navigator.clipboard.writeText(accNum).then(() => {
            const original = el.innerHTML;
            el.innerHTML = "Copied ✓";
            setTimeout(() => { el.innerHTML = original; }, 2000);
        });
    }

    function appendLoadingMessage(txt = 'Typing...') {
        removeLoadingMessage();
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `message bot loading`;
        div.id = 'loading-msg';
        div.textContent = txt;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return 'loading-msg';
    }

    function removeLoadingMessage() {
        const el = document.getElementById('loading-msg');
        if (el) el.remove();
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
</script>
</body>
