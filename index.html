<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connection Platform</title>
    <style>
        :root {
            --bg-body: #0b141a;
            --bg-container: #0b141a;
            --border-container: #222d34;
            --bg-header: #202c33;
            --text-header: #e9edef;
            --text-status: #8696a0;
            --bg-chat: #0b141a;
            --bg-user-msg: #005c4b;
            --text-user-msg: #e9edef;
            --bg-bot-msg: #202c33;
            --text-bot-msg: #e9edef;
            --bg-input-area: #202c33;
            --bg-input-wrapper: #2a3942;
            --text-input: #e9edef;
            --placeholder-input: #8696a0;
            --icon-color: #8696a0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; height: 100dvh; background: var(--bg-body); color: var(--text-bot-msg); overflow: hidden; }
        body { display: flex; justify-content: center; align-items: center; } 
        .chat-container { width: 100%; max-width: 480px; height: 100%; height: 100dvh; background: var(--bg-container); display: flex; flex-direction: column; }
        @media (min-width: 500px) { .chat-container { height: 92vh; border-radius: 12px; border: 1px solid var(--border-container); box-shadow: 0 4px 20px rgba(0,0,0,0.15); } }
        
        .chat-header { background: var(--bg-header); color: var(--text-header); padding: 10px 16px; display: flex; align-items: center; gap: 12px; height: 60px; flex-shrink: 0; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; }
        .header-info { flex: 1; }
        .header-name { font-size: 16px; font-weight: 500; }
        .header-status { font-size: 12px; color: var(--text-status); }

        .chat-box { flex: 1; min-height: 0; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-color: var(--bg-chat); }
        .message { max-width: 85%; padding: 8px 10px; border-radius: 7.5px; font-size: 14.5px; line-height: 1.4; word-break: break-word; }
        .message.user { background: var(--bg-user-msg); color: var(--text-user-msg); align-self: flex-end; border-top-right-radius: 0; }
        .message.bot { background: var(--bg-bot-msg); color: var(--text-bot-msg); align-self: flex-start; border-top-left-radius: 0; }
        .message.loading { color: var(--placeholder-input); font-style: italic; }

        .category-btn-container { padding: 10px 16px; background: var(--bg-input-area); display: none; text-align: center; border-top: 1px solid var(--border-container); }
        .action-link-btn { background: #D4AF37; color: #000; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: 800; display: inline-block; width: 100%; font-size: 14px; }

        .input-area { background: var(--bg-input-area); padding: 8px 12px; display: flex; align-items: center; gap: 8px; min-height: 62px; flex-shrink: 0; }
        .input-box-wrapper { flex: 1; background: var(--bg-input-wrapper); border-radius: 8px; display: flex; align-items: center; padding: 0 12px; }
        input[type="text"] { flex: 1; background: transparent; border: none; outline: none; color: var(--text-input); font-size: 16px; padding: 10px 0; }
        input[type="text"]::placeholder { color: var(--placeholder-input); }
        .send-btn { background: #00a884; color: #ffffff; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="avatar">💬</div>
        <div class="header-info">
            <div class="header-name">Connection Platform</div>
            <div class="header-status">online</div>
        </div>
    </div>
    
    <div id="chatBox" class="chat-box"></div>
    
    <div id="categoryButtonArea" class="category-btn-container">
        <a id="categoryLinkBtn" href="#" class="action-link-btn" target="_blank">Open Category Match Gallery</a>
    </div>

    <div class="input-area">
        <div class="input-box-wrapper">
            <input type="text" id="messageInput" placeholder="Type a message..." />
        </div>
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    const API_KEY = "sk-ec11c49f9d3845f19e94b2902a5c0665";
    const API_URL = "https://api.deepseek.com/chat/completions";

    const SYSTEM_PROMPT = `You are an agent for Connection Platform, a premium Nigerian private networking society. Guide candidates through membership enrollment with a firm, professional tone. 
    Follow sequential order strictly:
    - Q1: Ask name and city.
    - Q2: Give member stats and general link, ask which category they want (Sugar mommy/daddy, Hookup, Sex video call, Friends with benefits, Sex video/tape, Serious NG, Serious Int, Get paid chatting).
    - Q3: Give payment instructions for membership fee using Opay (8074938917 or 610 863 9595, name: akono mercy uka). Tell them to send proof of payment.
    - Once payment is verified, instruct them to open their category HTML page.
    Keep answers short, professional, and max 1-2 emojis.`;

    let chatHistory = JSON.parse(localStorage.getItem('deepseek_chat_history')) || [
        { role: "system", content: SYSTEM_PROMPT },
        { role: "assistant", content: "Hello! What's your name and which city are you living in?" }
    ];

    window.addEventListener('DOMContentLoaded', () => {
        renderChat();
        checkReturnParameters();
    });

    function renderChat() {
        const box = document.getElementById('chatBox');
        box.innerHTML = '';
        chatHistory.forEach(msg => {
            if (msg.role === 'system') return;
            const div = document.createElement('div');
            div.className = `message ${msg.role === 'assistant' ? 'bot' : 'user'} `;
            div.innerText = msg.content;
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    }

    function checkReturnParameters() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('returned') === 'true') {
            const amount = urlParams.get('amount') || '3000';
            const returnMsg = `Alright! Use this Opay bank account: 8074938917 or 610 863 9595 (Name: akono mercy uka) to pay the connection fee of ₦${amount}. Once done, send your proof of payment here.`;
            chatHistory.push({ role: "assistant", content: returnMsg });
            saveAndRender();
            window.history.replaceState({}, document.title, window.location.pathname); // clear url params
        }
    }

    document.getElementById('messageInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendMessage();
    });

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        chatHistory.push({ role: "user", content: text });
        input.value = '';
        saveAndRender();

        const loadingId = appendLoading();

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: chatHistory,
                    stream: false
                })
            });

            const data = await response.json();
            removeLoading(loadingId);

            const reply = data.choices && data.choices[0] ? data.choices[0].message.content : "I didn't catch that. Please reply again.";
            chatHistory.push({ role: "assistant", content: reply });
            saveAndRender();
            checkForCategoryTrigger(text, reply);

        } catch (err) {
            removeLoading(loadingId);
            chatHistory.push({ role: "assistant", content: "Network error. Please check your connection." });
            saveAndRender();
        }
    }

    function checkForCategoryTrigger(userText, botReply) {
        const lower = userText.toLowerCase();
        let targetPage = '';
        let categoryName = '';

        if (lower.includes('sugar') || lower.includes('mommy') || lower.includes('daddy')) {
            targetPage = 'sugar_mommy.html';
            categoryName = 'Sugar Mommy / Daddy';
        } else if (lower.includes('chat') || lower.includes('paid')) {
            targetPage = 'paid_chat.html';
            categoryName = 'Get Paid For Chatting';
        } else if (lower.includes('outside') || lower.includes('international') || lower.includes('foreign')) {
            targetPage = 'serious_int.html';
            categoryName = 'Serious Relationship Outside Nigeria';
        } else if (lower.includes('nigeria') || lower.includes('serious')) {
            targetPage = 'serious_ng.html';
            categoryName = 'Serious Relationship in Nigeria';
        } else if (lower.includes('hookup') || lower.includes('benefit') || lower.includes('video call') || lower.includes('fucking')) {
            targetPage = 'media_exchange.html';
            categoryName = 'Casual Connections';
        }

        if (targetPage) {
            localStorage.setItem('selected_category_name', categoryName);
            const btnArea = document.getElementById('categoryButtonArea');
            const linkBtn = document.getElementById('categoryLinkBtn');
            linkBtn.href = targetPage;
            linkBtn.innerText = `Open ${categoryName} Gallery`;
            btnArea.style.display = 'block';
        }
    }

    function saveAndRender() {
        localStorage.setItem('deepseek_chat_history', JSON.stringify(chatHistory));
        renderCardHistory();
    }

    function renderCardHistory() {
        const box = document.getElementById('chatBox');
        box.innerHTML = '';
        chatHistory.forEach(msg => {
            if (msg.role === 'system') return;
            const div = document.createElement('div');
            div.className = `message ${msg.role === 'assistant' ? 'bot' : 'user'}`;
            div.innerText = msg.content;
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    }

    function appendLoading() {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = 'message bot loading';
        div.id = 'loading-msg';
        div.innerText = 'Typing...';
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return 'loading-msg';
    }

    function removeLoading(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }
</script>
</body>
</html>
