<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Prevents page zooming and mobile viewport clipping -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VIP Connection Platform</title>
  <!-- Paystack Inline Script -->
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* Allows smooth full page scrolling on mobile browsers */
    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #0B0B0B;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }

    .app-wrapper {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 16px 40px 16px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background-color: #161616;
      border: 1.5px solid #D4AF37; /* Gold Border */
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
      display: flex;
      flex-direction: column;
      margin: auto 0;
    }

    /* Formatted for clean 2-line display on mobile screens */
    .card-instruction {
      color: #FFFFFF !important;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
      line-height: 1.4;
      display: block;
    }

    .question-label {
      color: #FFFFFF !important;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
      display: block;
    }

    /* Minimum 16px font-size prevents mobile Safari/iOS zoom */
    .input-field {
      width: 100%;
      background-color: #222222;
      border: 1px solid #444444;
      color: #FFFFFF;
      font-size: 16px !important;
      font-weight: 600;
      padding: 14px 16px;
      border-radius: 10px;
      outline: none;
      margin-bottom: 20px;
    }

    .input-field:focus {
      border-color: #D4AF37;
    }

    .btn-gold {
      width: 100%;
      background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
      color: #000000;
      font-size: 16px;
      font-weight: 800;
      padding: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    .btn-gallery {
      margin-bottom: 20px;
      background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
      color: #000000;
      font-weight: 800;
      font-size: 16px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      display: block;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
    }

    /* Categories List */
    .category-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .category-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #222222;
      border: 1px solid #333333;
      padding: 14px 16px;
      border-radius: 10px;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .category-btn.unlocked {
      border-color: #D4AF37;
      background-color: #1f1a0a;
    }

    .price-badge {
      background-color: #8B0000; /* Dark Red */
      color: #FFFFFF;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
    }

    .unlocked .price-badge {
      background-color: #D4AF37;
      color: #000000;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- STEP 1: NAME -->
    <div id="step-1" class="card hidden">
      <p class="card-instruction">Please enter your profile details to continue.</p>
      
      <label class="question-label">Question 1: What is your Full Name?</label>
      <input type="text" id="user-name" class="input-field" placeholder="e.g. David Johnson">
      
      <button class="btn-gold" onclick="nextStep(2)">Next Step &rarr;</button>
    </div>

    <!-- STEP 2: LOCATION -->
    <div id="step-2" class="card hidden">
      <p class="card-instruction">We use this to match you with available connections near you.</p>
      
      <label class="question-label">Question 2: Which city or state are you living in?</label>
      <input type="text" id="user-location" class="input-field" placeholder="e.g. Lagos, Nigeria">
      
      <button class="btn-gold" onclick="nextStep(3)">Continue to Categories &rarr;</button>
    </div>

    <!-- STEP 3: CATEGORIES & PAYMENT GATEWAY -->
    <div id="step-3" class="card hidden">
      <!-- Clean 2-line instruction text -->
      <p class="card-instruction">
        Please click on the button below to view pictures<br>of everyone available before selecting a category.
      </p>

      <!-- View Pictures Button -->
      <a href="gallery.html" class="btn-gallery">View Pictures</a>

      <div class="category-list" id="category-container">
        <!-- Rendered dynamically via JS -->
      </div>
    </div>
  </div>

  <script>
    const PAYSTACK_LIVE_KEY = "pk_live_88ba11e7af2c83ef0e73e19768947cdf5c2c124f";

    const categories = [
      { id: 'sugar_mommy', name: '1. VIP Financial Support Match', price: 2000, page: 'sugar_mommy.html' },
      { id: 'vip_social', name: '2. VIP Social Group Access', price: 1500, page: 'vip_social.html' },
      { id: 'private_video', name: '3. Private Video Connect', price: 1000, page: 'private_video.html' },
      { id: 'casual_friendship', name: '4. Casual Friendship Match', price: 1000, page: 'casual_friendship.html' },
      { id: 'media_exchange', name: '5. Media Exchange Match', price: 1000, page: 'media_exchange.html' },
      { id: 'serious_ng', name: '6. Serious Relationship (Nigeria)', price: 1000, page: 'serious_ng.html' },
      { id: 'serious_int', name: '7. Serious Relationship (Intl)', price: 5000, page: 'serious_int.html' },
      { id: 'paid_chat', name: '8. International Paid Chat', price: 8000, page: 'paid_chat.html' }
    ];

    // Auto-check if the user already answered questions previously
    window.addEventListener('DOMContentLoaded', () => {
      const onboardingDone = localStorage.getItem('onboarding_complete');
      if (onboardingDone === 'true') {
        showStep(3);
        renderCategories();
      } else {
        showStep(1);
      }
    });

    function showStep(stepNumber) {
      document.getElementById('step-1').classList.add('hidden');
      document.getElementById('step-2').classList.add('hidden');
      document.getElementById('step-3').classList.add('hidden');

      document.getElementById(`step-${stepNumber}`).classList.remove('hidden');
    }

    function nextStep(stepNumber) {
      if (stepNumber === 2) {
        const name = document.getElementById('user-name').value.trim();
        if (!name) return alert('Please enter your full name.');
        localStorage.setItem('user_name', name);
        showStep(2);
      }
      if (stepNumber === 3) {
        const loc = document.getElementById('user-location').value.trim();
        if (!loc) return alert('Please enter your location.');
        localStorage.setItem('user_location', loc);
        
        // Lock onboarding state so user skips questions on future visits/refreshes
        localStorage.setItem('onboarding_complete', 'true');
        showStep(3);
        renderCategories();
      }
    }

    function renderCategories() {
      const unlocked = JSON.parse(localStorage.getItem('unlocked_cats') || '[]');
      const container = document.getElementById('category-container');
      container.innerHTML = '';

      categories.forEach(cat => {
        const isUnlocked = unlocked.includes(cat.id);
        const btn = document.createElement('div');
        btn.className = `category-btn ${isUnlocked ? 'unlocked' : ''}`;
        btn.innerHTML = `
          <span>${cat.name}</span>
          <span class="price-badge">${isUnlocked ? 'UNLOCKED' : '₦' + cat.price.toLocaleString()}</span>
        `;
        btn.onclick = () => handleCategoryClick(cat);
        container.appendChild(btn);
      });
    }

    function handleCategoryClick(cat) {
      const unlocked = JSON.parse(localStorage.getItem('unlocked_cats') || '[]');

      if (unlocked.includes(cat.id)) {
        // Already paid -> Navigate directly to category page
        localStorage.setItem('selected_category_name', cat.name);
        window.location.href = cat.page;
      } else {
        // Launches Paystack directly without showing any popup alert
        payWithPaystack(cat);
      }
    }

    function payWithPaystack(cat) {
      const userName = localStorage.getItem('user_name') || "Customer";
      const userEmail = userName.replace(/\s+/g, '').toLowerCase() + '@connectionplatform.com';

      let handler = PaystackPop.setup({
        key: PAYSTACK_LIVE_KEY, 
        email: userEmail,
        amount: cat.price * 100, // Convert to kobo
        currency: 'NGN',
        callback: function(response) {
          alert('Payment successful! Category unlocked.');
          let unlocked = JSON.parse(localStorage.getItem('unlocked_cats') || '[]');
          if (!unlocked.includes(cat.id)) {
            unlocked.push(cat.id);
            localStorage.setItem('unlocked_cats', JSON.stringify(unlocked));
          }
          localStorage.setItem('selected_category_name', cat.name);
          renderCategories();
          window.location.href = cat.page;
        },
        onClose: function() {
          // Silent close on cancellation
        }
      });
      handler.openIframe();
    }
  </script>
</body>
</html>
